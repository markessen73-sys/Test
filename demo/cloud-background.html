<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Gravity Test</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      h1 { font-size: 1rem; font-weight: 500; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        background: #000;
        max-width: 100%;
      }
      canvas { display: block; max-width: 100%; height: auto; }
      #status, #timer {
        position: absolute;
        font-size: 11px;
        color: rgba(255,255,255,0.45);
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      #status {
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.85rem;
        color: #888;
        background: rgba(0,0,0,0.92);
      }
      #timer { top: 8px; right: 10px; }
      #mode-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #mode-bar button {
        font: inherit;
        font-size: 0.8rem;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #1a1a1a;
        color: #aaa;
        cursor: pointer;
      }
      #mode-bar button.active {
        border-color: #c44;
        background: #2a1515;
        color: #f88;
      }
      #mode-bar button.active-wrap {
        border-color: #c93;
        background: #2a2210;
        color: #fd8;
      }
      #mode-badge {
        position: absolute;
        top: 8px;
        left: 10px;
        font-size: 11px;
        color: rgba(255, 120, 120, 0.85);
        z-index: 2;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      p { font-size: 0.8rem; color: #666; max-width: 760px; text-align: center; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1 id="title">__TITLE_TEXT__</h1>
    <p id="build-tag" style="font-size:0.7rem;color:#555;margin-top:-8px;">build 2026-06-27k</p>
    <div id="mode-bar">
      <button type="button" id="btn-drop" class="__BTN_DROP_CLASS__">↓ Drop</button>
      <button type="button" id="btn-wrap-right" class="__BTN_WRAP_RIGHT_CLASS__">→ Wrap right</button>
      <button type="button" id="btn-wrap-left" class="__BTN_WRAP_LEFT_CLASS__">← Wrap left</button>
    </div>
    <div id="wrap">
      <canvas id="view"></canvas>
      <div id="mode-badge" class="__BADGE_CLASS__">__BADGE_TEXT__</div>
      <div id="status">Loading…</div>
      <div id="timer">0.00s / 2.00s</div>
    </div>
    <p id="desc">__DESC_TEXT__</p>
    <script>window.__ARENA_MODE__ = "__BAKED_MODE__";</script>
    <script>
      const FALL_SECONDS = 2;
      const WRAP_SPEED = 360;
      const SOLID_SEGMENTS = __SOLID_SEGMENTS__;
      const BG_DATA_URL = "__BG_DATA_URL__";
      const canvas = document.getElementById("view");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const timerEl = document.getElementById("timer");
      const titleEl = document.getElementById("title");
      const descEl = document.getElementById("desc");
      const modeBadgeEl = document.getElementById("mode-badge");
      const btnDrop = document.getElementById("btn-drop");
      const btnWrapRight = document.getElementById("btn-wrap-right");
      const btnWrapLeft = document.getElementById("btn-wrap-left");

      function parseInitialMode() {
        const baked = window.__ARENA_MODE__;
        if (baked === "drop" || baked === "wrap-right" || baked === "wrap-left") return baked;
        return "drop";
      }

      let mode = parseInitialMode();

      let W = 1536;
      let H = 1024;
      let gravity = 512;
      let background = null;
      let solid = null;
      let ready = false;
      let fallElapsed = 0;
      let dropX = 768;

      const BALL_R = 14;
      let ball = null;

      function isWrap() {
        return mode === "wrap-right" || mode === "wrap-left";
      }

      function buildSolidMap(segments, width, height) {
        const map = new Uint8Array(width * height);
        for (const [y, x0, x1] of segments) {
          const row = y * width;
          for (let x = x0; x <= x1; x++) map[row + x] = 1;
        }
        return map;
      }

      function findDropColumn(map, width, height) {
        const mid = Math.floor(width / 2);
        let centerGap = height;
        for (let y = 0; y < height; y++) {
          if (map[y * width + mid]) {
            centerGap = y;
            break;
          }
        }
        if (centerGap >= 100) return mid;

        let bestX = mid;
        let bestGap = 0;
        for (let x = 80; x < width - 80; x += 8) {
          let first = height;
          for (let y = 0; y < height; y++) {
            if (map[y * width + x]) {
              first = y;
              break;
            }
          }
          if (first > bestGap) {
            bestGap = first;
            bestX = x;
          }
        }
        return bestX;
      }

      function createBall() {
        if (isWrap()) {
          return {
            x: W / 2,
            y: BALL_R,
            spawnX: W / 2,
            spawnY: BALL_R,
            vy: 0,
            vx: mode === "wrap-left" ? -WRAP_SPEED : WRAP_SPEED,
            r: BALL_R,
            restTimer: 0,
            wrapCount: 0,
          };
        }
        return {
          x: dropX,
          y: BALL_R,
          spawnX: dropX,
          spawnY: BALL_R,
          vy: 0,
          vx: 0,
          r: BALL_R,
          restTimer: 0,
          wrapCount: 0,
        };
      }

      function resetBall() {
        ball.x = ball.spawnX;
        ball.y = ball.spawnY;
        ball.vy = 0;
        ball.vx = isWrap() ? (mode === "wrap-left" ? -WRAP_SPEED : WRAP_SPEED) : 0;
        ball.restTimer = 0;
        ball.wrapCount = 0;
        fallElapsed = 0;
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${src}`));
          img.src = src;
        });
      }

      function isSolid(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        if (ix < 0 || iy < 0 || ix >= W || iy >= H) return false;
        return solid[iy * W + ix] === 1;
      }

      function wrapBallX() {
        while (ball.x - ball.r > W) {
          ball.x -= W;
          ball.wrapCount++;
        }
        while (ball.x + ball.r < 0) {
          ball.x += W;
          ball.wrapCount++;
        }
      }

      function landOnPlatforms(dt) {
        if (ball.vy <= 0) return;

        const cx = Math.round(ball.x);
        const footY = ball.y + ball.r;
        const nextFoot = footY + ball.vy * dt;
        let surface = null;

        for (let y = Math.floor(footY); y <= Math.ceil(nextFoot); y++) {
          if (!isSolid(cx, y)) continue;
          surface = y;
          break;
        }

        if (surface !== null) {
          ball.y = surface - ball.r - 0.01;
          ball.vy = 0;
        }
      }

      function pushOutOfSolids() {
        if (!isSolid(ball.x, ball.y)) return;
        for (let y = Math.floor(ball.y - ball.r); y <= Math.ceil(ball.y + ball.r); y++) {
          for (let x = Math.floor(ball.x - ball.r); x <= Math.ceil(ball.x + ball.r); x++) {
            if (!isSolid(x, y)) continue;
            ball.y = y - ball.r - 0.01;
            ball.vy = 0;
            return;
          }
        }
      }

      function restingOnSolid() {
        return isSolid(ball.x, ball.y + ball.r + 1)
          || isSolid(ball.x - ball.r * 0.5, ball.y + ball.r + 1)
          || isSolid(ball.x + ball.r * 0.5, ball.y + ball.r + 1);
      }

      function step(dt) {
        fallElapsed += dt;

        if (isWrap()) {
          ball.x += ball.vx * dt;
          wrapBallX();
          timerEl.textContent = `wraps: ${ball.wrapCount}  x: ${Math.round(ball.x)}  vx: ${ball.vx > 0 ? "→" : "←"}`;
          return;
        }

        ball.vy += gravity * dt;
        ball.y += ball.vy * dt;
        landOnPlatforms(dt);
        pushOutOfSolids();

        if (ball.vy === 0 && restingOnSolid()) {
          ball.restTimer += dt;
          if (ball.restTimer > 2.5) resetBall();
        } else {
          ball.restTimer = 0;
        }

        timerEl.textContent = `${Math.min(fallElapsed, FALL_SECONDS).toFixed(2)}s / ${FALL_SECONDS.toFixed(2)}s`;
      }

      function drawBallAt(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ff3b3b";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawFrame() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        if (background) ctx.drawImage(background, 0, 0, W, H);

        const drawXs = [ball.x];
        if (ball.x - ball.r < 0) drawXs.push(ball.x + W);
        if (ball.x + ball.r > W) drawXs.push(ball.x - W);
        for (const x of drawXs) drawBallAt(x, ball.y);
      }

      let lastFrame = 0;

      function tick(now) {
        if (!ready) {
          requestAnimationFrame(tick);
          return;
        }
        if (!lastFrame) lastFrame = now;
        const dt = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        step(dt);
        drawFrame();
        requestAnimationFrame(tick);
      }

      function applyModeCopy() {
        btnDrop.className = mode === "drop" ? "active" : "";
        btnWrapRight.className = mode === "wrap-right" ? "active-wrap" : "";
        btnWrapLeft.className = mode === "wrap-left" ? "active-wrap" : "";

        if (mode === "wrap-right") {
          titleEl.textContent = "Wrap test — exits right, re-enters left";
          descEl.textContent = "Single red ball at the top moves right. When it leaves the right edge it wraps to the left.";
          modeBadgeEl.textContent = "WRAP →";
        } else if (mode === "wrap-left") {
          titleEl.textContent = "Wrap test — exits left, re-enters right";
          descEl.textContent = "Single red ball at the top moves left. When it leaves the left edge it wraps to the right.";
          modeBadgeEl.textContent = "WRAP ←";
        } else {
          titleEl.textContent = "Gravity test — vertical drop in 2 seconds";
          descEl.textContent = "Single red ball drops from the top center onto the platform below.";
          modeBadgeEl.textContent = "DROP ↓";
        }
      }

      function setMode(next) {
        if (mode === next) return;
        mode = next;
        applyModeCopy();
        if (solid) {
          ball = createBall();
          resetBall();
          lastFrame = 0;
        }
      }

      btnDrop.addEventListener("click", () => setMode("drop"));
      btnWrapRight.addEventListener("click", () => setMode("wrap-right"));
      btnWrapLeft.addEventListener("click", () => setMode("wrap-left"));

      async function init() {
        applyModeCopy();

        if (BG_DATA_URL && !BG_DATA_URL.startsWith("__")) {
          background = await loadImage(BG_DATA_URL);
        } else {
          const base = new URL("./assets/", window.location.href);
          for (const name of ["arena-bg.jpg", "arena-source.png"]) {
            try {
              background = await loadImage(new URL(name, base).href);
              break;
            } catch {
              // try next
            }
          }
        }
        if (!background) throw new Error("Background image missing");

        W = background.naturalWidth;
        H = background.naturalHeight;
        gravity = H / (0.5 * FALL_SECONDS * FALL_SECONDS);
        solid = buildSolidMap(SOLID_SEGMENTS, W, H);
        dropX = findDropColumn(solid, W, H);

        canvas.width = W;
        canvas.height = H;
        ball = createBall();
        resetBall();
        ready = true;
        statusEl.style.display = "none";
        lastFrame = 0;
        requestAnimationFrame(tick);
        drawFrame();
      }

      init().catch((err) => {
        statusEl.textContent = `Failed to load: ${err.message}`;
      });
    </script>
  </body>
</html>

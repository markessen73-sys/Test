<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Background Preview — 5s Loop</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
      }
      h1 { font-size: 1rem; font-weight: 500; letter-spacing: 0.04em; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      }
      canvas { display: block; }
      #timer {
        position: absolute;
        top: 8px;
        right: 10px;
        font-size: 11px;
        color: rgba(255,255,255,0.35);
        font-variant-numeric: tabular-nums;
      }
      p { font-size: 0.8rem; color: #666; max-width: 640px; text-align: center; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Cloud background preview — 5 second seamless loop</h1>
    <div id="wrap">
      <canvas id="sky" width="640" height="360"></canvas>
      <div id="timer">0.00s</div>
    </div>
    <p>Black sky with dark grey volumetric clouds. Three depth layers drift at different speeds and return to the exact same frame every 5.00 seconds.</p>
    <script>
      const LOOP_SECONDS = 5;
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const timerEl = document.getElementById("timer");
      const W = canvas.width;
      const H = canvas.height;

      // Seeded pseudo-random for stable cloud placement
      function seeded(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 0xffffffff;
        };
      }

      function makeCloudLayer(seed, count, yMin, yMax, minR, maxR, alpha) {
        const rand = seeded(seed);
        const puffs = [];
        // Tile width = W so scrolling one full width loops seamlessly
        for (let i = 0; i < count; i++) {
          const cx = rand() * W;
          const cy = yMin + rand() * (yMax - yMin);
          const r = minR + rand() * (maxR - minR);
          const shade = 0.14 + rand() * 0.12; // dark grey luminance
          const blobs = [];
          const blobCount = 4 + Math.floor(rand() * 5);
          for (let b = 0; b < blobCount; b++) {
            blobs.push({
              ox: (rand() - 0.5) * r * 1.6,
              oy: (rand() - 0.5) * r * 0.7,
              r: r * (0.45 + rand() * 0.55),
            });
          }
          puffs.push({ cx, cy, r, shade, blobs });
        }
        return { puffs, alpha };
      }

      // Integer speeds guarantee each layer completes whole tile widths in exactly 5s
      const layers = [
        { ...makeCloudLayer(101, 9, H * 0.08, H * 0.42, 48, 110, 0.55), speed: 1, blur: 28 },
        { ...makeCloudLayer(202, 12, H * 0.22, H * 0.62, 36, 90, 0.72), speed: 2, blur: 20 },
        { ...makeCloudLayer(303, 14, H * 0.38, H * 0.82, 28, 72, 0.88), speed: 3, blur: 14 },
      ];

      function drawPuff(puff, offsetX, layerAlpha, blur) {
        const base = puff.shade;
        for (const blob of puff.blobs) {
          const x = ((puff.cx + blob.ox + offsetX) % W + W) % W;
          const y = puff.cy + blob.oy;
          const g = ctx.createRadialGradient(x, y, 0, x, y, blob.r);
          const hi = `rgba(${Math.floor(base * 255 * 1.35)},${Math.floor(base * 255 * 1.35)},${Math.floor(base * 255 * 1.35)},${layerAlpha * puff.shade * 2.2})`;
          const mid = `rgba(${Math.floor(base * 255)},${Math.floor(base * 255)},${Math.floor(base * 255)},${layerAlpha * 0.9})`;
          const edge = `rgba(${Math.floor(base * 255 * 0.6)},${Math.floor(base * 255 * 0.6)},${Math.floor(base * 255 * 0.6)},0)`;
          g.addColorStop(0, hi);
          g.addColorStop(0.45, mid);
          g.addColorStop(1, edge);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, blob.r, 0, Math.PI * 2);
          ctx.fill();
        }
        // Draw wrapped duplicate for seamless horizontal tiling
        for (const blob of puff.blobs) {
          for (const wrap of [-W, W]) {
            const x = ((puff.cx + blob.ox + offsetX + wrap) % W + W) % W;
            const y = puff.cy + blob.oy;
            const g = ctx.createRadialGradient(x, y, 0, x, y, blob.r);
            const hi = `rgba(${Math.floor(base * 255 * 1.35)},${Math.floor(base * 255 * 1.35)},${Math.floor(base * 255 * 1.35)},${layerAlpha * puff.shade * 2.2})`;
            const mid = `rgba(${Math.floor(base * 255)},${Math.floor(base * 255)},${Math.floor(base * 255)},${layerAlpha * 0.9})`;
            const edge = `rgba(${Math.floor(base * 255 * 0.6)},${Math.floor(base * 255 * 0.6)},${Math.floor(base * 255 * 0.6)},0)`;
            g.addColorStop(0, hi);
            g.addColorStop(0.45, mid);
            g.addColorStop(1, edge);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(x, y, blob.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      function drawLayer(layer, t) {
        // offset completes exactly one tile width per LOOP_SECONDS * (1/speed) ... 
        // normalize so all layers loop at t=0 and t=LOOP_SECONDS
        const travel = (t / LOOP_SECONDS) * W * layer.speed;
        const offsetX = -travel;
        ctx.filter = `blur(${layer.blur}px)`;
        ctx.globalCompositeOperation = "source-over";
        for (const puff of layer.puffs) {
          drawPuff(puff, offsetX, layer.alpha, layer.blur);
        }
        ctx.filter = "none";
      }

      function drawSky(t) {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        // Subtle atmospheric depth — still black, just a whisper of gradient
        const atmo = ctx.createLinearGradient(0, 0, 0, H);
        atmo.addColorStop(0, "rgba(0,0,0,1)");
        atmo.addColorStop(1, "rgba(4,4,6,1)");
        ctx.fillStyle = atmo;
        ctx.fillRect(0, 0, W, H);

        for (const layer of layers) drawLayer(layer, t);

        // Soft vignette
        const vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,0.45)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
      }

      let start = performance.now();
      function frame(now) {
        const elapsed = ((now - start) / 1000) % LOOP_SECONDS;
        timerEl.textContent = `${elapsed.toFixed(2)}s / ${LOOP_SECONDS.toFixed(2)}s`;
        drawSky(elapsed);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Gravity Test</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      h1 { font-size: 1rem; font-weight: 500; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        background: #000;
        max-width: 100%;
      }
      canvas { display: block; max-width: 100%; height: auto; }
      #status, #timer {
        position: absolute;
        font-size: 11px;
        color: rgba(255,255,255,0.45);
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      #status {
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.85rem;
        color: #888;
        background: rgba(0,0,0,0.92);
      }
      #timer { top: 8px; right: 10px; }
      #mode-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #mode-bar button {
        font: inherit;
        font-size: 0.8rem;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #1a1a1a;
        color: #aaa;
        cursor: pointer;
      }
      #mode-bar button.active {
        border-color: #c44;
        background: #2a1515;
        color: #f88;
      }
      #mode-bar button.active-rise {
        border-color: #3cc;
        background: #152828;
        color: #8ff;
      }
      #mode-badge.rise {
        color: rgba(120, 255, 255, 0.9);
      }
      #mode-badge {
        position: absolute;
        top: 8px;
        left: 10px;
        font-size: 11px;
        color: rgba(255, 120, 120, 0.85);
        z-index: 2;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      p { font-size: 0.8rem; color: #666; max-width: 760px; text-align: center; line-height: 1.5; }
      code { font-size: 0.75rem; color: #888; }
    </style>
  </head>
  <body>
    <h1 id="title">__TITLE_TEXT__</h1>
    <p id="build-tag" style="font-size:0.7rem;color:#555;margin-top:-8px;">build 2026-06-27h</p>
    <div id="mode-bar">
      <button type="button" id="btn-drop" class="__BTN_DROP_CLASS__">↓ Drop test (tops)</button>
      <button type="button" id="btn-rise" class="__BTN_RISE_CLASS__">↑ Rise test (undersides)</button>
    </div>
    <div id="wrap">
      <canvas id="view"></canvas>
      <div id="mode-badge" class="__BADGE_CLASS__">__BADGE_TEXT__</div>
      <div id="status">Loading…</div>
      <div id="timer">0.00s / 2.00s</div>
    </div>
    <p id="desc">__DESC_TEXT__</p>
    <script>window.__ARENA_RISE__ = __IS_RISE__;</script>
    <script>
      const FALL_SECONDS = 2;
      const IS_RISE = window.__ARENA_RISE__ === true;
      const SOLID_SEGMENTS = __SOLID_SEGMENTS__;
      const PLATFORM_SPAWNS = __PLATFORM_SPAWNS__;
      const BG_DATA_URL = "__BG_DATA_URL__";
      const canvas = document.getElementById("view");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const timerEl = document.getElementById("timer");
      const titleEl = document.getElementById("title");
      const descEl = document.getElementById("desc");
      const modeBadgeEl = document.getElementById("mode-badge");
      const btnDrop = document.getElementById("btn-drop");
      const btnRise = document.getElementById("btn-rise");

      let mode = IS_RISE ? "rise" : "drop";

      let W = 1536;
      let H = 1024;
      let gravity = 512;
      let background = null;
      let solid = null;
      let ready = false;
      let fallElapsed = 0;

      const BALL_R = 14;
      let balls = [];
      let spawns = [];

      function buildSolidMap(segments, width, height) {
        const map = new Uint8Array(width * height);
        for (const [y, x0, x1] of segments) {
          const row = y * width;
          for (let x = x0; x <= x1; x++) map[row + x] = 1;
        }
        return map;
      }

      function findPlatformSpawns(map, width, height) {
        const caps = [];
        for (let x = 0; x < width; x++) {
          let prev = -1;
          for (let y = 0; y < height; y++) {
            if (!map[y * width + x]) {
              prev = -1;
              continue;
            }
            if (prev < 0 || y > prev + 1) caps.push({ x, capY: y });
            prev = y;
          }
        }

        const groups = [];
        const Y_TOL = 30;
        const MIN_SPAN = 45;

        for (const cap of caps) {
          let group = groups.find(
            (g) =>
              Math.abs(g.capY - cap.capY) <= Y_TOL &&
              cap.x >= g.x0 - 20 &&
              cap.x <= g.x1 + 20,
          );
          if (group) {
            group.x0 = Math.min(group.x0, cap.x);
            group.x1 = Math.max(group.x1, cap.x);
            group.capY = Math.round((group.capY + cap.capY) / 2);
          } else {
            groups.push({ x0: cap.x, x1: cap.x, capY: cap.capY });
          }
        }

        return groups
          .filter((g) => g.x1 - g.x0 >= MIN_SPAN)
          .map((g) => ({ x: Math.round((g.x0 + g.x1) / 2), capY: g.capY }))
          .sort((a, b) => a.capY - b.capY || a.x - b.x);
      }

      function findSegmentBounds(map, width, height, x, nearY) {
        let y = nearY;
        if (!map[y * width + x]) {
          let best = -1;
          let bestDist = Infinity;
          for (let yy = 0; yy < height; yy++) {
            if (!map[yy * width + x]) continue;
            const d = Math.abs(yy - nearY);
            if (d < bestDist) {
              bestDist = d;
              best = yy;
            }
          }
          if (best < 0) return { top: nearY, bottom: nearY };
          y = best;
        }

        let top = y;
        while (top > 0 && map[(top - 1) * width + x]) top--;
        let bottom = y;
        while (bottom < height - 1 && map[(bottom + 1) * width + x]) bottom++;
        return { top, bottom };
      }

      function isRise() {
        return mode === "rise";
      }

      function nextSolidBelow(map, width, x, belowY) {
        for (let y = belowY + 1; y < map.length / width; y++) {
          if (map[y * width + x]) return y;
        }
        return map.length / width;
      }

      function riseSpawnY(bounds, map, width, x, height) {
        const gapFloor = bounds.bottom + BALL_R + 18;
        const nextTop = nextSolidBelow(map, width, x, bounds.bottom);
        const gapCeil = nextTop < height
          ? nextTop - BALL_R - 18
          : height - BALL_R - 8;
        if (gapCeil <= gapFloor) return gapFloor;
        return Math.min(gapCeil, Math.max(gapFloor, height * 0.82));
      }

      function createBall(spawn, map, width, height) {
        const bounds = findSegmentBounds(map, width, height, spawn.x, spawn.capY);

        if (isRise()) {
          const spawnY = riseSpawnY(bounds, map, width, spawn.x, height);
          return {
            x: spawn.x,
            y: spawnY,
            spawnY,
            vy: 0,
            r: BALL_R,
            restTimer: 0,
            bounds,
          };
        }

        let clearColumn = true;
        for (let y = 0; y < spawn.capY - BALL_R - 2; y++) {
          if (map[y * width + spawn.x]) {
            clearColumn = false;
            break;
          }
        }
        const spawnY = clearColumn
          ? BALL_R
          : Math.max(spawn.capY - BALL_R * 2 - 10, BALL_R);
        return {
          x: spawn.x,
          y: spawnY,
          spawnY,
          vy: 0,
          r: BALL_R,
          restTimer: 0,
          bounds,
        };
      }

      function resetBall(ball) {
        ball.y = ball.spawnY;
        ball.vy = 0;
        ball.restTimer = 0;
      }

      function resetAllBalls() {
        fallElapsed = 0;
        for (const ball of balls) resetBall(ball);
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${src}`));
          img.src = src;
        });
      }

      function isSolid(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        if (ix < 0 || iy < 0 || ix >= W || iy >= H) return false;
        return solid[iy * W + ix] === 1;
      }

      function landOnPlatforms(ball, dt) {
        if (ball.vy <= 0) return;

        const cx = Math.round(ball.x);
        const footY = ball.y + ball.r;
        const nextFoot = footY + ball.vy * dt;
        let surface = null;

        for (let y = Math.floor(footY); y <= Math.ceil(nextFoot); y++) {
          if (!isSolid(cx, y)) continue;
          surface = y;
          break;
        }

        if (surface !== null) {
          ball.y = surface - ball.r - 0.01;
          ball.vy = 0;
        }
      }

      function hitUnderside(ball, dt) {
        if (ball.vy >= 0) return;

        const cx = Math.round(ball.x);
        const headY = ball.y - ball.r;
        const nextHead = headY + ball.vy * dt;
        let surface = null;

        for (let y = Math.ceil(headY); y >= Math.floor(nextHead); y--) {
          if (!isSolid(cx, y)) continue;
          if (y < ball.bounds.top || y > ball.bounds.bottom) continue;
          surface = y;
          break;
        }

        if (surface !== null) {
          ball.y = surface + ball.r + 0.01;
          ball.vy = 0;
        }
      }

      function pushOutOfSolids(ball) {
        if (!isSolid(ball.x, ball.y)) return;

        if (isRise()) {
          for (let y = Math.ceil(ball.y + ball.r); y < H; y++) {
            if (isSolid(ball.x, y)) continue;
            ball.y = y + ball.r + 0.01;
            ball.vy = 0;
            return;
          }
          return;
        }

        for (let y = Math.floor(ball.y - ball.r); y <= Math.ceil(ball.y + ball.r); y++) {
          for (let x = Math.floor(ball.x - ball.r); x <= Math.ceil(ball.x + ball.r); x++) {
            if (!isSolid(x, y)) continue;
            ball.y = y - ball.r - 0.01;
            ball.vy = 0;
            return;
          }
        }
      }

      function restingOnSolid(ball) {
        if (isRise()) {
          return isSolid(ball.x, ball.y - ball.r - 1)
            || isSolid(ball.x - ball.r * 0.5, ball.y - ball.r - 1)
            || isSolid(ball.x + ball.r * 0.5, ball.y - ball.r - 1);
        }
        return isSolid(ball.x, ball.y + ball.r + 1)
          || isSolid(ball.x - ball.r * 0.5, ball.y + ball.r + 1)
          || isSolid(ball.x + ball.r * 0.5, ball.y + ball.r + 1);
      }

      function step(dt) {
        fallElapsed += dt;
        const g = isRise() ? -gravity : gravity;

        for (const ball of balls) {
          ball.vy += g * dt;
          ball.y += ball.vy * dt;
          if (isRise()) hitUnderside(ball, dt);
          else landOnPlatforms(ball, dt);
          pushOutOfSolids(ball);

          if (ball.vy === 0 && restingOnSolid(ball)) {
            ball.restTimer += dt;
            if (ball.restTimer > 2.5) resetBall(ball);
          } else {
            ball.restTimer = 0;
          }
        }

        const label = isRise() ? "rise ↑" : "fall ↓";
        timerEl.textContent = `${Math.min(fallElapsed, FALL_SECONDS).toFixed(2)}s / ${FALL_SECONDS.toFixed(2)}s ${label}`;
      }

      function drawFrame() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        if (background) ctx.drawImage(background, 0, 0, W, H);

        for (const ball of balls) {
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
          ctx.fillStyle = isRise() ? "#3bffff" : "#ff3b3b";
          ctx.fill();
          ctx.strokeStyle = isRise() ? "#cff" : "#fff";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      let lastFrame = 0;

      function tick(now) {
        if (!ready) {
          requestAnimationFrame(tick);
          return;
        }
        if (!lastFrame) lastFrame = now;
        const dt = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        step(dt);
        drawFrame();
        requestAnimationFrame(tick);
      }

      function applyModeCopy() {
        btnDrop.className = mode === "drop" ? "active" : "";
        btnRise.className = mode === "rise" ? "active-rise" : "";
        modeBadgeEl.className = mode === "rise" ? "rise" : "";
        modeBadgeEl.textContent = mode === "rise" ? "RISE ↑" : "DROP ↓";

        if (mode === "rise") {
          titleEl.textContent = "Underside test — balls rise in 2 seconds";
          descEl.textContent = "Cyan balls start near the bottom and rise with reversed gravity until they hit each platform underside.";
        } else {
          titleEl.textContent = "Gravity test — vertical drop in 2 seconds";
          descEl.textContent = "Red balls drop onto each platform top. Click ↑ Rise test (undersides) to send cyan balls upward instead.";
        }
      }

      function setupBalls() {
        balls = spawns.map((spawn) => createBall(spawn, solid, W, H));
        resetAllBalls();
        lastFrame = 0;
      }

      function setMode(next) {
        if (mode === next) return;
        mode = next;
        applyModeCopy();
        if (solid) setupBalls();
      }

      btnDrop.addEventListener("click", () => setMode("drop"));
      btnRise.addEventListener("click", () => setMode("rise"));

      async function init() {
        applyModeCopy();

        if (BG_DATA_URL && !BG_DATA_URL.startsWith("__")) {
          background = await loadImage(BG_DATA_URL);
        } else {
          const base = new URL("./assets/", window.location.href);
          for (const name of ["arena-bg.jpg", "arena-source.png"]) {
            try {
              background = await loadImage(new URL(name, base).href);
              break;
            } catch {
              // try next
            }
          }
        }
        if (!background) throw new Error("Background image missing");

        W = background.naturalWidth;
        H = background.naturalHeight;
        gravity = H / (0.5 * FALL_SECONDS * FALL_SECONDS);
        solid = buildSolidMap(SOLID_SEGMENTS, W, H);

        spawns =
          Array.isArray(PLATFORM_SPAWNS) && PLATFORM_SPAWNS.length
            ? PLATFORM_SPAWNS
            : findPlatformSpawns(solid, W, H);

        canvas.width = W;
        canvas.height = H;
        setupBalls();
        ready = true;
        statusEl.style.display = "none";
        lastFrame = 0;
        requestAnimationFrame(tick);
        drawFrame();
      }

      init().catch((err) => {
        statusEl.textContent = `Failed to load: ${err.message}`;
      });
    </script>
  </body>
</html>

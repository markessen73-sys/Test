<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena + Cloud Background Preview</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
      }
      h1 { font-size: 1rem; font-weight: 500; letter-spacing: 0.04em; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        background: #000;
      }
      canvas { display: block; }
      #timer {
        position: absolute;
        top: 8px;
        right: 10px;
        font-size: 11px;
        color: rgba(255,255,255,0.35);
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.85rem;
        color: #888;
        background: #000;
      }
      p { font-size: 0.8rem; color: #666; max-width: 720px; text-align: center; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Rock arena foreground + cloud gaps — 5 second loop</h1>
    <div id="wrap">
      <canvas id="sky" width="768" height="512"></canvas>
      <div id="status">Loading foreground…</div>
      <div id="timer">0.00s</div>
    </div>
    <p>Foreground rocks are baked first. Clouds are drawn only into the empty gaps, then the rock layer is composited on top.</p>
    <script>
      const LOOP_SECONDS = 5;
      const W = 768;
      const H = 512;
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const timerEl = document.getElementById("timer");
      const statusEl = document.getElementById("status");

      const cloudBuffer = document.createElement("canvas");
      cloudBuffer.width = W;
      cloudBuffer.height = H;
      const cloudCtx = cloudBuffer.getContext("2d");

      let rocksImage = null;
      let maskImage = null;
      let ready = false;

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${src}`));
          img.src = src;
        });
      }

      function seeded(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 0xffffffff;
        };
      }

      function makeCloudLayer(seed, count, yMin, yMax, minR, maxR, alpha) {
        const rand = seeded(seed);
        const puffs = [];
        for (let i = 0; i < count; i++) {
          const cx = rand() * W;
          const cy = yMin + rand() * (yMax - yMin);
          const r = minR + rand() * (maxR - minR);
          const shade = 0.14 + rand() * 0.12;
          const blobs = [];
          const blobCount = 4 + Math.floor(rand() * 5);
          for (let b = 0; b < blobCount; b++) {
            blobs.push({
              ox: (rand() - 0.5) * r * 1.6,
              oy: (rand() - 0.5) * r * 0.7,
              r: r * (0.45 + rand() * 0.55),
            });
          }
          puffs.push({ cx, cy, r, shade, blobs });
        }
        return { puffs, alpha };
      }

      const layers = [
        { ...makeCloudLayer(101, 9, H * 0.08, H * 0.42, 48, 110, 0.55), speed: 1, blur: 28 },
        { ...makeCloudLayer(202, 12, H * 0.22, H * 0.62, 36, 90, 0.72), speed: 2, blur: 20 },
        { ...makeCloudLayer(303, 14, H * 0.38, H * 0.82, 28, 72, 0.88), speed: 3, blur: 14 },
      ];

      function drawPuff(targetCtx, puff, offsetX, layerAlpha) {
        const base = puff.shade;
        const drawBlob = (x, y, r) => {
          const g = targetCtx.createRadialGradient(x, y, 0, x, y, r);
          const hi = `rgba(${Math.floor(base * 255 * 1.35)},${Math.floor(base * 255 * 1.35)},${Math.floor(base * 255 * 1.35)},${layerAlpha * puff.shade * 2.2})`;
          const mid = `rgba(${Math.floor(base * 255)},${Math.floor(base * 255)},${Math.floor(base * 255)},${layerAlpha * 0.9})`;
          const edge = `rgba(${Math.floor(base * 255 * 0.6)},${Math.floor(base * 255 * 0.6)},${Math.floor(base * 255 * 0.6)},0)`;
          g.addColorStop(0, hi);
          g.addColorStop(0.45, mid);
          g.addColorStop(1, edge);
          targetCtx.fillStyle = g;
          targetCtx.beginPath();
          targetCtx.arc(x, y, r, 0, Math.PI * 2);
          targetCtx.fill();
        };

        for (const blob of puff.blobs) {
          const x = ((puff.cx + blob.ox + offsetX) % W + W) % W;
          drawBlob(x, puff.cy + blob.oy, blob.r);
          for (const wrap of [-W, W]) {
            drawBlob(((puff.cx + blob.ox + offsetX + wrap) % W + W) % W, puff.cy + blob.oy, blob.r);
          }
        }
      }

      function drawCloudsToBuffer(t) {
        cloudCtx.setTransform(1, 0, 0, 1, 0, 0);
        cloudCtx.clearRect(0, 0, W, H);
        cloudCtx.fillStyle = "#000000";
        cloudCtx.fillRect(0, 0, W, H);

        const atmo = cloudCtx.createLinearGradient(0, 0, 0, H);
        atmo.addColorStop(0, "rgba(0,0,0,1)");
        atmo.addColorStop(1, "rgba(4,4,6,1)");
        cloudCtx.fillStyle = atmo;
        cloudCtx.fillRect(0, 0, W, H);

        for (const layer of layers) {
          const travel = (t / LOOP_SECONDS) * W * layer.speed;
          cloudCtx.filter = `blur(${layer.blur}px)`;
          for (const puff of layer.puffs) drawPuff(cloudCtx, puff, -travel, layer.alpha);
          cloudCtx.filter = "none";
        }
      }

      function drawFrame(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        drawCloudsToBuffer(t);

        // Clip clouds to gap areas only (where mask is opaque)
        ctx.drawImage(cloudBuffer, 0, 0);
        ctx.globalCompositeOperation = "destination-in";
        ctx.drawImage(maskImage, 0, 0);

        // Rock foreground on top
        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(rocksImage, 0, 0, W, H);

        ctx.globalCompositeOperation = "source-over";
        const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.85);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,0.3)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
      }

      async function init() {
        try {
          const base = new URL("./assets/", window.location.href);
          [rocksImage, maskImage] = await Promise.all([
            loadImage(new URL("arena-rocks.png", base).href),
            loadImage(new URL("arena-cloud-mask.png", base).href),
          ]);
          ready = true;
          statusEl.style.display = "none";
        } catch (err) {
          statusEl.textContent = `Failed to load foreground assets: ${err.message}`;
          console.error(err);
        }
      }

      let start = performance.now();
      function frame(now) {
        if (ready) {
          const elapsed = ((now - start) / 1000) % LOOP_SECONDS;
          timerEl.textContent = `${elapsed.toFixed(2)}s / ${LOOP_SECONDS.toFixed(2)}s`;
          drawFrame(elapsed);
        }
        requestAnimationFrame(frame);
      }

      init().then(() => requestAnimationFrame(frame));
    </script>
  </body>
</html>

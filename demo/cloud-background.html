<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Background Preview</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      h1 { font-size: 1rem; font-weight: 500; }
      #picker {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      #picker label {
        font-size: 0.8rem;
        border: 1px solid #444;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        background: #1a1a1a;
      }
      #picker input { display: none; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        background: #000;
        max-width: 100%;
      }
      canvas { display: block; max-width: 100%; height: auto; }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 20px;
        font-size: 0.85rem;
        color: #888;
        background: rgba(0,0,0,0.92);
        line-height: 1.5;
      }
      p { font-size: 0.8rem; color: #666; max-width: 720px; text-align: center; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Rock arena on black background</h1>
    <div id="picker">
      <label>Load foreground image<input id="file" type="file" accept="image/png,image/jpeg,image/webp" /></label>
      <span id="source-label" style="font-size:0.75rem;color:#666">Loading…</span>
    </div>
    <div id="wrap">
      <canvas id="sky"></canvas>
      <div id="status">Loading…</div>
    </div>
    <p>Your rock image is used exactly as provided on a solid black background.</p>
    <script>
      const BLACK_THRESHOLD = 14;
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const sourceLabel = document.getElementById("source-label");
      const fileInput = document.getElementById("file");

      let rocksCanvas = null;

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${src}`));
          img.src = src;
        });
      }

      function processForeground(img, label) {
        const W = img.naturalWidth;
        const H = img.naturalHeight;
        canvas.width = W;
        canvas.height = H;

        const src = document.createElement("canvas");
        src.width = W;
        src.height = H;
        const srcCtx = src.getContext("2d");
        srcCtx.drawImage(img, 0, 0);

        const data = srcCtx.getImageData(0, 0, W, H);
        const px = data.data;

        rocksCanvas = document.createElement("canvas");
        rocksCanvas.width = W;
        rocksCanvas.height = H;
        const rocksCtx = rocksCanvas.getContext("2d");
        const rocksData = rocksCtx.createImageData(W, H);

        for (let i = 0; i < px.length; i += 4) {
          const r = px[i];
          const g = px[i + 1];
          const b = px[i + 2];
          const lum = r * 0.2126 + g * 0.7152 + b * 0.0722;
          const isSky = lum < BLACK_THRESHOLD;

          rocksData.data[i] = r;
          rocksData.data[i + 1] = g;
          rocksData.data[i + 2] = b;
          rocksData.data[i + 3] = isSky ? 0 : 255;
        }

        rocksCtx.putImageData(rocksData, 0, 0);
        drawFrame();
        statusEl.style.display = "none";
        sourceLabel.textContent = label;
      }

      function usePrebuilt(rocksImg, label) {
        canvas.width = rocksImg.naturalWidth;
        canvas.height = rocksImg.naturalHeight;
        rocksCanvas = document.createElement("canvas");
        rocksCanvas.width = rocksImg.naturalWidth;
        rocksCanvas.height = rocksImg.naturalHeight;
        rocksCanvas.getContext("2d").drawImage(rocksImg, 0, 0);
        drawFrame();
        statusEl.style.display = "none";
        sourceLabel.textContent = label;
      }

      function drawFrame() {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(rocksCanvas, 0, 0);
      }

      async function tryLoadBundled() {
        const base = new URL("./assets/", window.location.href);
        try {
          const rocksImg = await loadImage(new URL("arena-rocks.png", base).href);
          usePrebuilt(rocksImg, "Using your foreground image");
          return true;
        } catch {
          // fall through
        }

        try {
          const img = await loadImage(new URL("arena-source.png", base).href);
          processForeground(img, "Using arena-source.png");
          return true;
        } catch {
          return false;
        }
      }

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        const img = await loadImage(URL.createObjectURL(file));
        processForeground(img, `Using ${file.name}`);
      });

      async function init() {
        const loaded = await tryLoadBundled();
        if (!loaded) {
          statusEl.innerHTML = "Add your image to <code>demo/assets/arena-source.png</code><br>or use the button above to load it now.";
          sourceLabel.textContent = "No foreground image found";
        }
      }

      init();
    </script>
  </body>
</html>

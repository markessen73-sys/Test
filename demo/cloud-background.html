<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Physics Preview</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      h1 { font-size: 1rem; font-weight: 500; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        background: #000;
        max-width: 100%;
      }
      canvas { display: block; max-width: 100%; height: auto; }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #888;
        background: #000;
      }
      p { font-size: 0.8rem; color: #666; max-width: 760px; text-align: center; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Rock arena — gravity + horizontal wrap</h1>
    <div id="wrap">
      <canvas id="view"></canvas>
      <div id="status">Loading…</div>
    </div>
    <p>Only rock platforms are solid. Light shading is background. Gravity drops from top to bottom in 2 seconds. The level wraps horizontally.</p>
    <script>
      const FALL_SECONDS = 2;
      const canvas = document.getElementById("view");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");

      let W = 1536;
      let H = 1024;
      let gravity = H / (0.5 * FALL_SECONDS * FALL_SECONDS);
      let background = null;
      let solid = null;
      let ready = false;

      const ball = {
        x: W / 2,
        y: 14,
        vx: 220,
        vy: 0,
        r: 10,
      };

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${src}`));
          img.src = src;
        });
      }

      function wrapX(x) {
        x %= W;
        if (x < 0) x += W;
        return x;
      }

      function buildSolidMap(img) {
        const off = document.createElement("canvas");
        off.width = W;
        off.height = H;
        const offCtx = off.getContext("2d");
        offCtx.drawImage(img, 0, 0);
        const data = offCtx.getImageData(0, 0, W, H).data;
        const map = new Uint8Array(W * H);
        for (let i = 0; i < W * H; i++) {
          map[i] = data[i * 4 + 3] > 128 ? 1 : 0;
        }
        return map;
      }

      function isSolid(px, py) {
        const x = Math.floor(px);
        const y = Math.floor(py);
        if (y < 0 || y >= H) return false;
        const xl = wrapX(x);
        const xr = wrapX(x + 1);
        return solid[y * W + xl] || solid[y * W + xr];
      }

      function resolveCircle() {
        for (let pass = 0; pass < 6; pass++) {
          let hit = false;
          const minX = Math.floor(ball.x - ball.r - 1);
          const maxX = Math.ceil(ball.x + ball.r + 1);
          const minY = Math.floor(ball.y - ball.r - 1);
          const maxY = Math.ceil(ball.y + ball.r + 1);

          for (let y = minY; y <= maxY; y++) {
            for (let ox = minX; ox <= maxX; ox++) {
              const x = wrapX(ox);
              if (!isSolid(x, y)) continue;
              const dx = ball.x - (x + 0.5);
              const dy = ball.y - (y + 0.5);
              const dist = Math.hypot(dx, dy);
              if (dist < ball.r && dist > 0.0001) {
                const nx = dx / dist;
                const ny = dy / dist;
                const push = ball.r - dist;
                ball.x += nx * push;
                ball.y += ny * push;
                const vn = ball.vx * nx + ball.vy * ny;
                if (vn < 0) {
                  ball.vx -= vn * nx * 1.2;
                  ball.vy -= vn * ny * 1.2;
                }
                hit = true;
              }
            }
          }
          if (!hit) break;
        }
      }

      function drawBackground() {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(background, 0, 0, W, H);
      }

      function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ff4d4d";
        ctx.fill();
        ctx.strokeStyle = "#ffd0d0";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawFrame() {
        drawBackground();
        drawBall();
      }

      let last = performance.now();
      function frame(now) {
        if (!ready) {
          requestAnimationFrame(frame);
          return;
        }

        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;

        ball.vy += gravity * dt;
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.x = wrapX(ball.x);

        if (ball.y - ball.r > H) {
          ball.y = ball.r;
          ball.vy = 0;
        }

        resolveCircle();

        drawFrame();
        requestAnimationFrame(frame);
      }

      async function init() {
        const base = new URL("./assets/", window.location.href);
        background = await loadImage(new URL("arena-source.png", base).href);
        const collisionImg = await loadImage(new URL("arena-collision.png", base).href);
        W = background.naturalWidth;
        H = background.naturalHeight;
        gravity = H / (0.5 * FALL_SECONDS * FALL_SECONDS);
        canvas.width = W;
        canvas.height = H;
        solid = buildSolidMap(collisionImg);
        ball.x = W / 2;
        ball.y = ball.r + 2;
        ready = true;
        statusEl.style.display = "none";
        requestAnimationFrame(frame);
      }

      init().catch((err) => {
        statusEl.textContent = `Failed to load: ${err.message}`;
        console.error(err);
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Background Preview — 5s Loop</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
      }
      h1 { font-size: 1rem; font-weight: 500; letter-spacing: 0.04em; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      }
      canvas { display: block; }
      #timer {
        position: absolute;
        top: 8px;
        right: 10px;
        font-size: 11px;
        color: rgba(255,255,255,0.35);
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      p { font-size: 0.8rem; color: #666; max-width: 640px; text-align: center; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Arena foreground over cloud sky — 5 second seamless loop</h1>
    <div id="wrap">
      <canvas id="sky" width="768" height="512"></canvas>
      <div id="timer">0.00s</div>
    </div>
    <p>Rock arena sits in front. Dark grey clouds drift behind it through the black gaps. Three cloud layers loop every 5.00 seconds.</p>
    <script>
      const LOOP_SECONDS = 5;
      const canvas = document.getElementById("sky");
      const ctx = canvas.getContext("2d");
      const timerEl = document.getElementById("timer");
      const W = canvas.width;
      const H = canvas.height;

      let arenaImage = null;
      let arenaReady = false;

      function makeBlackTransparent(image) {
        const off = document.createElement("canvas");
        off.width = image.width;
        off.height = image.height;
        const offCtx = off.getContext("2d");
        offCtx.drawImage(image, 0, 0);
        const data = offCtx.getImageData(0, 0, off.width, off.height);
        const px = data.data;
        for (let i = 0; i < px.length; i += 4) {
          const r = px[i];
          const g = px[i + 1];
          const b = px[i + 2];
          const lum = r * 0.2126 + g * 0.7152 + b * 0.0722;
          if (lum < 18) px[i + 3] = 0;
        }
        offCtx.putImageData(data, 0, 0);
        return off;
      }

      const arenaLoader = new Image();
      arenaLoader.onload = () => {
        arenaImage = makeBlackTransparent(arenaLoader);
        arenaReady = true;
      };
      arenaLoader.src = "./assets/arena-foreground.png";

      function seeded(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s * 1664525 + 1013904223) >>> 0;
          return s / 0xffffffff;
        };
      }

      function makeCloudLayer(seed, count, yMin, yMax, minR, maxR, alpha) {
        const rand = seeded(seed);
        const puffs = [];
        for (let i = 0; i < count; i++) {
          const cx = rand() * W;
          const cy = yMin + rand() * (yMax - yMin);
          const r = minR + rand() * (maxR - minR);
          const shade = 0.14 + rand() * 0.12;
          const blobs = [];
          const blobCount = 4 + Math.floor(rand() * 5);
          for (let b = 0; b < blobCount; b++) {
            blobs.push({
              ox: (rand() - 0.5) * r * 1.6,
              oy: (rand() - 0.5) * r * 0.7,
              r: r * (0.45 + rand() * 0.55),
            });
          }
          puffs.push({ cx, cy, r, shade, blobs });
        }
        return { puffs, alpha };
      }

      const layers = [
        { ...makeCloudLayer(101, 9, H * 0.08, H * 0.42, 48, 110, 0.55), speed: 1, blur: 28 },
        { ...makeCloudLayer(202, 12, H * 0.22, H * 0.62, 36, 90, 0.72), speed: 2, blur: 20 },
        { ...makeCloudLayer(303, 14, H * 0.38, H * 0.82, 28, 72, 0.88), speed: 3, blur: 14 },
      ];

      function drawPuff(puff, offsetX, layerAlpha) {
        const base = puff.shade;
        const drawBlob = (x, y, r) => {
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          const hi = `rgba(${Math.floor(base * 255 * 1.35)},${Math.floor(base * 255 * 1.35)},${Math.floor(base * 255 * 1.35)},${layerAlpha * puff.shade * 2.2})`;
          const mid = `rgba(${Math.floor(base * 255)},${Math.floor(base * 255)},${Math.floor(base * 255)},${layerAlpha * 0.9})`;
          const edge = `rgba(${Math.floor(base * 255 * 0.6)},${Math.floor(base * 255 * 0.6)},${Math.floor(base * 255 * 0.6)},0)`;
          g.addColorStop(0, hi);
          g.addColorStop(0.45, mid);
          g.addColorStop(1, edge);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        };

        for (const blob of puff.blobs) {
          const x = ((puff.cx + blob.ox + offsetX) % W + W) % W;
          drawBlob(x, puff.cy + blob.oy, blob.r);
          for (const wrap of [-W, W]) {
            drawBlob(((puff.cx + blob.ox + offsetX + wrap) % W + W) % W, puff.cy + blob.oy, blob.r);
          }
        }
      }

      function drawLayer(layer, t) {
        const travel = (t / LOOP_SECONDS) * W * layer.speed;
        const offsetX = -travel;
        ctx.filter = `blur(${layer.blur}px)`;
        for (const puff of layer.puffs) drawPuff(puff, offsetX, layer.alpha);
        ctx.filter = "none";
      }

      function drawClouds(t) {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        const atmo = ctx.createLinearGradient(0, 0, 0, H);
        atmo.addColorStop(0, "rgba(0,0,0,1)");
        atmo.addColorStop(1, "rgba(4,4,6,1)");
        ctx.fillStyle = atmo;
        ctx.fillRect(0, 0, W, H);

        for (const layer of layers) drawLayer(layer, t);
      }

      function drawArenaForeground() {
        if (!arenaReady) return;
        const scale = Math.max(W / arenaImage.width, H / arenaImage.height);
        const dw = arenaImage.width * scale;
        const dh = arenaImage.height * scale;
        const dx = (W - dw) / 2;
        const dy = (H - dh) / 2;
        ctx.drawImage(arenaImage, dx, dy, dw, dh);
      }

      function drawFrame(t) {
        drawClouds(t);
        drawArenaForeground();

        const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.85);
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, "rgba(0,0,0,0.35)");
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
      }

      let start = performance.now();
      function frame(now) {
        const elapsed = ((now - start) / 1000) % LOOP_SECONDS;
        timerEl.textContent = `${elapsed.toFixed(2)}s / ${LOOP_SECONDS.toFixed(2)}s`;
        drawFrame(elapsed);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>

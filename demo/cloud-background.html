<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Gravity Test</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      h1 { font-size: 1rem; font-weight: 500; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        background: #000;
        max-width: 100%;
      }
      canvas { display: block; max-width: 100%; height: auto; }
      #status, #timer {
        position: absolute;
        font-size: 11px;
        color: rgba(255,255,255,0.45);
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      #status {
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.85rem;
        color: #888;
        background: rgba(0,0,0,0.92);
      }
      #timer { top: 8px; right: 10px; }
      p { font-size: 0.8rem; color: #666; max-width: 760px; text-align: center; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Gravity test — vertical drop in 2 seconds</h1>
    <div id="wrap">
      <canvas id="view"></canvas>
      <div id="status">Loading…</div>
      <div id="timer">0.00s / 2.00s</div>
    </div>
    <p>Red ball drops straight down. Rock platforms are solid — it stops on contact with no bounce.</p>
    <script>
      const FALL_SECONDS = 2;
      const STEP_MS = 1000 / 60;
      const SUBSTEPS = 4;
      const canvas = document.getElementById("view");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const timerEl = document.getElementById("timer");

      let W = 1536;
      let H = 1024;
      let gravity = 512;
      let background = null;
      let solid = null;
      let ready = false;
      let fallElapsed = 0;
      let restTimer = 0;

      const ball = { x: 0, y: 0, vy: 0, r: 14 };

      function resetBall() {
        ball.x = W / 2;
        ball.y = ball.r;
        ball.vy = 0;
        fallElapsed = 0;
        restTimer = 0;
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${src}`));
          img.src = src;
        });
      }

      function buildSolidMap(img) {
        const off = document.createElement("canvas");
        off.width = W;
        off.height = H;
        const offCtx = off.getContext("2d");
        offCtx.drawImage(img, 0, 0);
        const data = offCtx.getImageData(0, 0, W, H).data;
        const map = new Uint8Array(W * H);
        for (let i = 0; i < W * H; i++) {
          map[i] = data[i * 4 + 3] > 128 ? 1 : 0;
        }
        return map;
      }

      function isSolid(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        if (ix < 0 || iy < 0 || ix >= W || iy >= H) return false;
        return solid[iy * W + ix] === 1;
      }

      function resolvePlatforms() {
        for (let pass = 0; pass < 10; pass++) {
          let hit = false;
          const minX = Math.floor(ball.x - ball.r - 1);
          const maxX = Math.ceil(ball.x + ball.r + 1);
          const minY = Math.floor(ball.y - ball.r - 1);
          const maxY = Math.ceil(ball.y + ball.r + 1);

          for (let y = minY; y <= maxY; y++) {
            for (let x = minX; x <= maxX; x++) {
              if (!isSolid(x, y)) continue;
              const px = x + 0.5;
              const py = y + 0.5;
              const dx = ball.x - px;
              const dy = ball.y - py;
              const dist = Math.hypot(dx, dy);
              if (dist >= ball.r || dist < 0.0001) continue;

              const nx = dx / dist;
              const ny = dy / dist;
              const push = ball.r - dist;
              ball.x += nx * push;
              ball.y += ny * push;

              const vn = ball.vy * ny;
              if (vn < 0) {
                ball.vy -= vn * ny;
                if (ny < -0.3) ball.vy = 0;
              }
              hit = true;
            }
          }
          if (!hit) break;
        }
      }

      function onSolid() {
        const samples = [
          [ball.x, ball.y + ball.r + 1],
          [ball.x - ball.r * 0.6, ball.y + ball.r + 1],
          [ball.x + ball.r * 0.6, ball.y + ball.r + 1],
        ];
        return samples.some(([x, y]) => isSolid(x, y));
      }

      function step(dt) {
        if (Math.abs(ball.vy) < 2 && onSolid()) {
          restTimer += dt;
          if (restTimer > 1.5) resetBall();
        } else {
          restTimer = 0;
        }

        fallElapsed += dt;
        ball.vy += gravity * dt;
        const dy = (ball.vy * dt) / SUBSTEPS;

        for (let i = 0; i < SUBSTEPS; i++) {
          ball.y += dy;
          resolvePlatforms();
        }

        timerEl.textContent = `${Math.min(fallElapsed, FALL_SECONDS).toFixed(2)}s / ${FALL_SECONDS.toFixed(2)}s`;
      }

      function drawFrame() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        if (background) ctx.drawImage(background, 0, 0, W, H);

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ff3b3b";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function tick() {
        if (!ready) return;
        step(STEP_MS / 1000);
        drawFrame();
      }

      async function init() {
        const base = new URL("./assets/", window.location.href);
        for (const name of ["arena-bg.jpg", "arena-source.png"]) {
          try {
            background = await loadImage(new URL(name, base).href);
            break;
          } catch {
            // try next
          }
        }
        if (!background) throw new Error("Background image missing");

        const collisionImg = await loadImage(new URL("arena-collision.png", base).href);
        W = background.naturalWidth;
        H = background.naturalHeight;
        gravity = H / (0.5 * FALL_SECONDS * FALL_SECONDS);
        canvas.width = W;
        canvas.height = H;
        solid = buildSolidMap(collisionImg);
        resetBall();
        ready = true;
        statusEl.style.display = "none";
        setInterval(tick, STEP_MS);
        drawFrame();
      }

      init().catch((err) => {
        statusEl.textContent = `Failed to load: ${err.message}`;
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <title>Adventures Of Crappy Capri</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #111;
        color: #ccc;
        font-family: system-ui, sans-serif;
        padding: 12px;
      }
      h1 { display: none; }
      #wrap {
        position: relative;
        border: 1px solid #333;
        box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        background: #000;
        max-width: 100%;
      }
      #audio-start-overlay {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        border: none;
        background: rgba(0, 0, 0, 0.94);
        color: #fff;
        cursor: pointer;
        font: 900 clamp(1.1rem, 4.5vw, 1.6rem) Impact, "Arial Black", sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #audio-start-overlay.is-hidden {
        display: none;
      }
      #audio-start-overlay .audio-start-sub {
        display: block;
        margin-top: 12px;
        font: 0.72rem "Courier New", monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      canvas { display: block; max-width: 100%; height: auto; vertical-align: top; }
      #status, #timer {
        position: absolute;
        font-size: 11px;
        color: rgba(255,255,255,0.45);
        font-variant-numeric: tabular-nums;
        z-index: 2;
      }
      #status {
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 0.85rem;
        color: #888;
        background: rgba(0,0,0,0.92);
      }
      #timer { display: none; }
      #mode-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      #mode-bar {
        display: none;
      }
      #mode-bar button {
        font: inherit;
        font-size: 0.8rem;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #1a1a1a;
        color: #aaa;
        cursor: pointer;
      }
      #mode-bar button.active {
        border-color: #c44;
        background: #2a1515;
        color: #f88;
      }
      #mode-bar button.active-wrap {
        border-color: #c93;
        background: #2a2210;
        color: #fd8;
      }
      #mode-badge {
        display: none;
      }
      #lives-bar {
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        min-height: 1.25rem;
        margin-bottom: 8px;
      }
      #lives-bar.is-hidden {
        display: none;
      }
      .life-pip {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ff6060, #c01818);
        border: 1px solid rgba(255, 180, 180, 0.55);
        box-shadow: 0 0 8px rgba(255, 50, 50, 0.55);
      }
      .life-pip.lost {
        background: #2a2a2a;
        border-color: #444;
        box-shadow: none;
      }
      p { font-size: 0.8rem; color: #666; max-width: 760px; text-align: center; line-height: 1.5; }
      #play-column {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #control-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(64px, 22vw, 104px);
        padding: 14px 0 4px;
      }
      .control-side {
        display: contents;
      }
      .control-landscape-only {
        display: none !important;
      }
      .control-btn {
        width: 2cm;
        height: 2cm;
        border-radius: 50%;
        border: 2px solid #666;
        background: radial-gradient(circle at 35% 30%, #666, #1a1a1a);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        cursor: pointer;
        flex-shrink: 0;
        touch-action: none;
        font: inherit;
        font-size: 1.35rem;
        line-height: 1;
        color: #ccc;
        display: grid;
        place-items: center;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      #lift-btn,
      #left-lift-btn {
        border-color: #8a2020;
        background: radial-gradient(circle at 35% 30%, #e84040, #a01010);
        color: transparent;
        font-size: 0;
      }
      #lift-btn.pressed,
      #left-lift-btn.pressed {
        border-color: #ff6060;
        background: radial-gradient(circle at 35% 30%, #ff7070, #c02020);
        box-shadow: 0 2px 8px rgba(255, 60, 60, 0.45);
      }
      .thumbstick {
        position: relative;
        width: 2.4cm;
        height: 2.4cm;
        border-radius: 50%;
        border: 2px solid #666;
        background: radial-gradient(circle at 50% 50%, #3a3a3a, #141414);
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.45);
        touch-action: none;
        flex-shrink: 0;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
      }
      .thumbstick.is-disabled {
        opacity: 0.35;
        pointer-events: none;
        cursor: default;
      }
      .thumbstick-track {
        position: absolute;
        inset: 18%;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
        box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.45);
        pointer-events: none;
      }
      .thumbstick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 34%;
        height: 34%;
        margin-left: -17%;
        margin-top: -17%;
        border-radius: 50%;
        border: 2px solid #888;
        background: radial-gradient(circle at 35% 30%, #da8, #432);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        transition: transform 0.05s ease-out;
        pointer-events: none;
      }
      .thumbstick.left .thumbstick-knob {
        transform: translateX(-38%);
        border-color: #fd8;
        background: radial-gradient(circle at 35% 30%, #ffc870, #6a4010);
      }
      .thumbstick.right .thumbstick-knob {
        transform: translateX(38%);
        border-color: #fd8;
        background: radial-gradient(circle at 35% 30%, #ffc870, #6a4010);
      }
      .thumbstick.up .thumbstick-knob {
        transform: translateY(-38%);
        border-color: #fd8;
        background: radial-gradient(circle at 35% 30%, #ffc870, #6a4010);
      }
      .thumbstick.down .thumbstick-knob {
        transform: translateY(38%);
        border-color: #fd8;
        background: radial-gradient(circle at 35% 30%, #ffc870, #6a4010);
      }
      .control-btn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #chrome-hint {
        display: none;
        position: fixed;
        top: env(safe-area-inset-top, 0);
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        max-width: 92vw;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.82);
        color: rgba(255, 255, 255, 0.82);
        font-size: 0.72rem;
        text-align: center;
        pointer-events: none;
      }

      @media (orientation: landscape) and (max-height: 520px) {
        html {
          height: 100%;
          overflow: hidden;
        }
        body {
          position: fixed;
          inset: 0;
          padding: 0;
          gap: 0;
          overflow: hidden;
          width: 100%;
          height: 100svh;
          min-height: 100svh;
        }
        body > h1,
        body > #build-tag,
        body > #desc {
          display: none;
        }
        #play-column {
          width: 100%;
          height: 100%;
          gap: 0;
          justify-content: center;
          align-items: center;
          display: grid;
          grid-template-columns: auto minmax(0, min(calc(100svh * 3 / 2), calc(100vw - 15rem))) auto;
          grid-template-rows: auto minmax(0, 1fr);
          column-gap: clamp(6px, 1.4vw, 14px);
        }
        #lives-bar {
          grid-column: 2;
          grid-row: 1;
          align-self: end;
          margin-bottom: 4px;
        }
        #wrap {
          grid-column: 2;
          grid-row: 2;
          border: none;
          box-shadow: none;
          max-width: none;
          width: 100%;
          height: min(100svh, calc(100% * 2 / 3));
          aspect-ratio: 3 / 2;
        }
        canvas {
          width: 100%;
          height: 100%;
          max-width: none;
        }
        #control-bar {
          display: contents;
          padding: 0;
        }
        .control-side-left {
          grid-column: 1;
          grid-row: 1 / span 2;
          display: flex !important;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: clamp(6px, 1.6vh, 12px);
          pointer-events: none;
        }
        .control-side-right {
          grid-column: 3;
          grid-row: 1 / span 2;
          display: flex !important;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: clamp(6px, 1.6vh, 12px);
          pointer-events: none;
        }
        .control-portrait-only {
          display: none !important;
        }
        .control-landscape-only[hidden] {
          display: none !important;
        }
        .control-landscape-only:not([hidden]) {
          display: grid !important;
        }
        #control-bar .control-btn,
        #control-bar .thumbstick {
          pointer-events: auto;
          --landscape-lift-square: clamp(76px, 16vh, 96px);
          --landscape-thumbstick-square: clamp(108px, 26vh, 148px);
        }
        #control-bar .control-btn {
          width: var(--landscape-lift-square);
          height: var(--landscape-lift-square);
          border: 2px solid #8a2020;
          border-radius: 50%;
          color: transparent;
          font-size: 0;
          background: radial-gradient(circle at 35% 30%, #e84040, #a01010);
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        }
        #control-bar .control-btn.pressed {
          border-color: #ff6060;
          background: radial-gradient(circle at 35% 30%, #ff7070, #c02020);
          box-shadow: 0 2px 8px rgba(255, 60, 60, 0.45);
        }
        #control-bar .thumbstick {
          width: var(--landscape-thumbstick-square);
          height: var(--landscape-thumbstick-square);
          border: none;
          background: transparent;
          box-shadow: none;
          filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.55));
        }
        #control-bar .thumbstick-track {
          inset: 14%;
          background: linear-gradient(90deg, rgba(245, 198, 98, 0.35) 0%, rgba(40, 40, 40, 0.55) 45%, rgba(40, 40, 40, 0.55) 55%, rgba(245, 198, 98, 0.35) 100%);
        }
        #control-bar .thumbstick-knob {
          width: 38%;
          height: 38%;
          margin-left: -19%;
          margin-top: -19%;
        }
        #chrome-hint {
          display: block;
        }
        #chrome-hint.is-hidden {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="chrome-hint">Tap the game for fullscreen · Add to Home Screen to hide the URL bar</div>
    <h1 id="title">__TITLE_TEXT__</h1>
    <p id="build-tag" style="font-size:0.7rem;color:#555;margin-top:-8px;">build 2026-07-04zg</p>
    <div id="play-column">
      <div id="lives-bar" class="is-hidden" aria-label="Lives"></div>
      <div id="wrap">
        <canvas id="view"></canvas>
        <button type="button" id="audio-start-overlay" class="is-hidden" aria-label="Tap to start">
          Tap to Start
          <span class="audio-start-sub">Sound on · Intro begins</span>
        </button>
        <div id="mode-badge">__BADGE_TEXT__</div>
        <div id="status">Loading…</div>
        <div id="timer">0.00s / 3.00s</div>
      </div>
      <div id="control-bar">
        <div class="control-side control-side-left">
          <button type="button" id="left-lift-btn" class="control-btn control-landscape-only" aria-label="Fire" hidden></button>
        </div>
        <button type="button" id="lift-btn" class="control-btn control-portrait-only" aria-label="Fire"></button>
        <div class="control-side control-side-right">
          <div id="thumbstick" class="thumbstick" role="slider" aria-label="Hold left or right" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0">
            <div class="thumbstick-track"></div>
            <div class="thumbstick-knob"></div>
          </div>
        </div>
      </div>
    </div>
    <p id="desc">__DESC_TEXT__</p>
    <script>window.__ARENA_MODE__ = "__BAKED_MODE__";</script>
    <script>
      const FALL_SECONDS = 3;
      const WRAP_SPEED = 360;
      const DEBUG_GREEN_BG = false;
      const SOLID_SEGMENTS = __SOLID_SEGMENTS__;
      const LEVEL2_ARENA = __LEVEL2_ARENA__;
      const BG_DATA_URL = "__BG_DATA_URL__";
      const BACKDROP_DATA_URL = "__BACKDROP_DATA_URL__";
      const PEW_DATA_URL = "__PEW_DATA_URL__";
      const BEEP_DATA_URL = "__BEEP_DATA_URL__";
      const VEGAS_MUSIC_DATA_URL = "__VEGAS_MUSIC_DATA_URL__";
      const HYPNOTIZED_MUSIC_DATA_URL = "__HYPNOTIZED_MUSIC_DATA_URL__";
      const ROYAL_BAROQUE_MUSIC_DATA_URL = "__ROYAL_BAROQUE_MUSIC_DATA_URL__";
      const CAR_CRASH_DATA_URL = "__CAR_CRASH_DATA_URL__";
      const PORTABLE_ASSET_BASE = "__PORTABLE_ASSET_BASE__";
      const canvas = document.getElementById("view");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const timerEl = document.getElementById("timer");
      const titleEl = document.getElementById("title");
      const descEl = document.getElementById("desc");
      const modeBadgeEl = document.getElementById("mode-badge");
      const livesBarEl = document.getElementById("lives-bar");
      const liftBtn = document.getElementById("lift-btn");
      const leftLiftBtn = document.getElementById("left-lift-btn");
      const thumbstickEl = document.getElementById("thumbstick");
      const wrapEl = document.getElementById("wrap");
      const chromeHintEl = document.getElementById("chrome-hint");
      const audioStartOverlay = document.getElementById("audio-start-overlay");

      function githubRawBaseFromUrl(url) {
        if (!url) return null;
        let decoded = url;
        try {
          decoded = decodeURIComponent(url);
        } catch (_) {}
        const blob = decoded.match(/github\.com\/([^/]+\/[^/]+)\/blob\/([^/]+)\/(.+?)(?:\?|#|$)/);
        if (blob) {
          const [, repo, branch, filePath] = blob;
          return `https://raw.githubusercontent.com/${repo}/${branch}/${filePath.replace(/[^/]+$/, "")}`;
        }
        const raw = decoded.match(/raw\.githubusercontent\.com\/([^/]+\/[^/]+)\/([^/]+)\/(.+?)(?:\?|#|$)/);
        if (raw) {
          const [, repo, branch, filePath] = raw;
          return `https://raw.githubusercontent.com/${repo}/${branch}/${filePath.replace(/[^/]+$/, "")}`;
        }
        const ghRaw = decoded.match(/github\.com\/([^/]+\/[^/]+)\/raw\/([^/]+)\/(.+?)(?:\?|#|$)/);
        if (ghRaw) {
          const [, repo, branch, filePath] = ghRaw;
          return `https://raw.githubusercontent.com/${repo}/${branch}/${filePath.replace(/[^/]+$/, "")}`;
        }
        return null;
      }

      function resolveAssetUrl(src) {
        if (!src || src.startsWith("data:") || src.startsWith("http")) return src;

        if (PORTABLE_ASSET_BASE && !PORTABLE_ASSET_BASE.startsWith("__")) {
          if (src.startsWith("assets/")) return PORTABLE_ASSET_BASE + src.slice("assets/".length);
        }

        const host = window.location.hostname;
        if (host === "raw.githubusercontent.com") {
          const base = window.location.pathname.replace(/[^/]+$/, "");
          return `https://raw.githubusercontent.com${base}${src}`;
        }

        if (host === "htmlpreview.github.io") {
          let q = window.location.search.slice(1);
          try {
            q = decodeURIComponent(q);
          } catch (_) {}
          const rawBase = githubRawBaseFromUrl(q) || githubRawBaseFromUrl(window.location.href);
          if (rawBase) return `${rawBase}${src}`;
        }

        if (host.endsWith(".github.io") && host !== "htmlpreview.github.io") {
          return new URL(src, window.location.href).href;
        }

        return new URL(src, window.location.href).href;
      }

      function createArenaAudio() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let ctx = null;
        let sfxBus = null;
        let musicBus = null;
        let lastZap = 0;

        function ensure() {
          if (!AudioCtx) return null;
          if (!ctx) {
            ctx = new AudioCtx();
            sfxBus = ctx.createGain();
            sfxBus.gain.value = 1;
            sfxBus.connect(ctx.destination);
            musicBus = ctx.createGain();
            musicBus.gain.value = 0.16;
            musicBus.connect(ctx.destination);
          }
          if (ctx.state === "suspended") ctx.resume();
          return ctx;
        }

        function outBus(ac) {
          ensure();
          return sfxBus ?? ac.destination;
        }

        function resolveAssetSrc(src) {
          return resolveAssetUrl(src);
        }

        function createSampleVoice(src, placeholder) {
          let buffer = null;
          let load = null;
          const enabled = src && !src.startsWith(placeholder);

          function loadSample(ac) {
            if (buffer) return Promise.resolve(buffer);
            if (load) return load;
            load = fetch(resolveAssetSrc(src))
              .then((res) => res.arrayBuffer())
              .then((arr) => ac.decodeAudioData(arr))
              .then((buf) => {
                buffer = buf;
                return buf;
              })
              .catch(() => null);
            return load;
          }

          function play(ac, now, volume, fadeOut, onMiss) {
            const start = (buf) => {
              const playDur = buf.duration;
              const voice = ac.createBufferSource();
              voice.buffer = buf;
              const gain = ac.createGain();
              gain.gain.setValueAtTime(volume, now);
              if (fadeOut) {
                const fadeTime = Math.min(0.42, Math.max(0.18, playDur * 0.38));
                const fadeStart = Math.max(0, playDur - fadeTime);
                gain.gain.setValueAtTime(volume, now + fadeStart);
                gain.gain.exponentialRampToValueAtTime(0.001, now + playDur);
              }
              voice.connect(gain);
              gain.connect(outBus(ac));
              voice.start(now, 0, playDur);
            };

            if (buffer) {
              start(buffer);
              return;
            }

            loadSample(ac).then((buf) => {
              if (buf) start(buf);
              else if (onMiss) onMiss();
            });
          }

          return { enabled, play, loadSample };
        }

        const pew = createSampleVoice(PEW_DATA_URL, "__PEW");
        const beep = createSampleVoice(BEEP_DATA_URL, "__BEEP");
        const carCrash = createSampleVoice(CAR_CRASH_DATA_URL, "__CAR_CRASH");
        const titleMusic = createSampleVoice(HYPNOTIZED_MUSIC_DATA_URL, "__HYPNOTIZED_MUSIC");
        const vegasMusic = createSampleVoice(VEGAS_MUSIC_DATA_URL, "__VEGAS_MUSIC");
        const levelTwoMusic = createSampleVoice(ROYAL_BAROQUE_MUSIC_DATA_URL, "__ROYAL_BAROQUE_MUSIC");

        let titleAudio = null;
        let titleMusicPending = false;
        let titleMusicEpoch = 0;
        let allowTitleMusic = false;
        let vegasMusicSource = null;
        let vegasMusicStarted = false;
        let vegasMusicPending = false;
        let levelTwoMusicSource = null;
        let levelTwoMusicStarted = false;
        let levelTwoMusicPending = false;

        function unlockAudio(ac) {
          if (!ac) return Promise.resolve(false);
          if (ac.state === "running") return Promise.resolve(true);
          return ac.resume().then(() => ac.state === "running");
        }

        function ensureTitleAudio() {
          if (!titleMusic.enabled) return null;
          if (!titleAudio) {
            titleAudio = new Audio(resolveAssetSrc(HYPNOTIZED_MUSIC_DATA_URL));
            titleAudio.loop = true;
            titleAudio.volume = 0.16;
            titleAudio.preload = "auto";
          }
          return titleAudio;
        }

        function isTitleMusicPlaying() {
          return Boolean(titleAudio && !titleAudio.paused);
        }

        function tryPlayTitleMusic() {
          if (!allowTitleMusic) return Promise.resolve(false);
          const audio = ensureTitleAudio();
          if (!audio) return Promise.resolve(false);
          const epoch = titleMusicEpoch;
          return audio
            .play()
            .then(() => {
              if (!allowTitleMusic || epoch !== titleMusicEpoch) {
                audio.pause();
                audio.currentTime = 0;
                return false;
              }
              titleMusicPending = false;
              return true;
            })
            .catch(() => {
              if (epoch === titleMusicEpoch) titleMusicPending = true;
              return false;
            });
        }

        function unlockTitleMusicFromGesture() {
          allowTitleMusic = true;
          titleMusicEpoch++;
          const audio = ensureTitleAudio();
          if (!audio) return false;
          const playPromise = audio.play();
          titleMusicPending = false;
          if (playPromise) {
            playPromise.catch(() => {
              titleMusicPending = true;
            });
          }
          return true;
        }

        function stopTitleMusic() {
          titleMusicEpoch++;
          allowTitleMusic = false;
          titleMusicPending = false;
          if (titleAudio) {
            titleAudio.pause();
            titleAudio.currentTime = 0;
          }
        }

        function beginTitleScreens() {
          allowTitleMusic = true;
          titleMusicEpoch++;
          return tryPlayTitleMusic();
        }

        function unlockTitleMusic() {
          if (!allowTitleMusic || isTitleMusicPlaying()) return Promise.resolve(isTitleMusicPlaying());
          return tryPlayTitleMusic();
        }

        function startLoopingTrack(ac, voice, getSource, setSource, getStarted, setStarted, getPending, setPending) {
          if (!musicBus || !voice.enabled) return Promise.resolve();
          if (getStarted() && getSource()) return Promise.resolve();

          return unlockAudio(ac).then((running) =>
            voice.loadSample(ac).then((buf) => {
              if (!buf || !musicBus) return;
              if (!running) {
                setPending(true);
                return;
              }
              const prev = getSource();
              if (prev) {
                try {
                  prev.stop();
                } catch (_) {}
              }
              const src = ac.createBufferSource();
              src.buffer = buf;
              src.loop = true;
              src.connect(musicBus);
              src.start(0);
              setSource(src);
              setStarted(true);
              setPending(false);
            }),
          );
        }

        function startVegasMusic(ac) {
          return startLoopingTrack(
            ac,
            vegasMusic,
            () => vegasMusicSource,
            (v) => {
              vegasMusicSource = v;
            },
            () => vegasMusicStarted,
            (v) => {

        function playZapSynth(ac, now) {
          const duration = 0.24;
          const master = ac.createGain();
          master.gain.setValueAtTime(0.75, now);
          master.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          master.connect(outBus(ac));

          const bufferSize = Math.floor(ac.sampleRate * duration);
          const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
          }
          const noise = ac.createBufferSource();
          noise.buffer = buffer;
          const hp = ac.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 1400;
          const bp = ac.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 4200;
          bp.Q.value = 1.2;
          noise.connect(hp);
          hp.connect(bp);
          bp.connect(master);
          noise.start(now);
          noise.stop(now + duration);

          for (let i = 0; i < 5; i++) {
            const arc = ac.createOscillator();
            arc.type = "square";
            arc.frequency.setValueAtTime(700 + Math.random() * 2800, now + i * 0.018);
            const arcGain = ac.createGain();
            arcGain.gain.setValueAtTime(0.12, now + i * 0.018);
            arcGain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.018 + 0.05);
            arc.connect(arcGain);
            arcGain.connect(master);
            arc.start(now + i * 0.018);
            arc.stop(now + i * 0.018 + 0.06);
          }
        }

        function playZap() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;
          if (now - lastZap < 0.05) return;
          lastZap = now;

          if (beep.enabled) {
            beep.play(ac, now, 0.9, false);
            return;
          }

          playZapSynth(ac, now);
        }

        function playKerchingSynth(ac, now) {
          const ding = ac.createOscillator();
          ding.type = "sine";
          ding.frequency.setValueAtTime(2100, now);
          ding.frequency.exponentialRampToValueAtTime(3200, now + 0.04);
          const dingGain = ac.createGain();
          dingGain.gain.setValueAtTime(0.0001, now);
          dingGain.gain.exponentialRampToValueAtTime(0.42, now + 0.008);
          dingGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
          ding.connect(dingGain);
          dingGain.connect(outBus(ac));
          ding.start(now);
          ding.stop(now + 0.36);

          const coin = ac.createOscillator();
          coin.type = "triangle";
          coin.frequency.setValueAtTime(3800, now + 0.05);
          const coinGain = ac.createGain();
          coinGain.gain.setValueAtTime(0.0001, now + 0.05);
          coinGain.gain.exponentialRampToValueAtTime(0.28, now + 0.06);
          coinGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
          coin.connect(coinGain);
          coinGain.connect(outBus(ac));
          coin.start(now + 0.05);
          coin.stop(now + 0.43);

          const register = ac.createOscillator();
          register.type = "square";
          register.frequency.value = 1200;
          const regGain = ac.createGain();
          regGain.gain.setValueAtTime(0.0001, now + 0.1);
          regGain.gain.exponentialRampToValueAtTime(0.14, now + 0.11);
          regGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          register.connect(regGain);
          regGain.connect(outBus(ac));
          register.start(now + 0.1);
          register.stop(now + 0.3);
        }

        function playKerching() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;

          if (pew.enabled) {
            pew.play(ac, now, 0.9, false);

        function playCrashSynth(ac, now) {
          const bus = outBus(ac);
          const dur = 1.05;

          const master = ac.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.exponentialRampToValueAtTime(0.95, now + 0.02);
          master.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          master.connect(bus);

          const bufferSize = Math.floor(ac.sampleRate * dur);
          const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const env = 1 - i / bufferSize;
            data[i] = (Math.random() * 2 - 1) * env * env;
          }
          const noise = ac.createBufferSource();
          noise.buffer = buffer;
          const hp = ac.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 400;
          const lp = ac.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.setValueAtTime(4200, now);
          lp.frequency.exponentialRampToValueAtTime(180, now + dur);
          noise.connect(hp);
          hp.connect(lp);
          lp.connect(master);
          noise.start(now);
          noise.stop(now + dur);

          const thump = ac.createOscillator();
          thump.type = "sine";
          thump.frequency.setValueAtTime(110, now);
          thump.frequency.exponentialRampToValueAtTime(42, now + 0.35);
          const thumpGain = ac.createGain();
          thumpGain.gain.setValueAtTime(0.7, now);
          thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
          thump.connect(thumpGain);
          thumpGain.connect(bus);
          thump.start(now);
          thump.stop(now + 0.52);
        }

      function stickFromClientX(clientX) {
        const rect = thumbstickEl.getBoundingClientRect();
        const x = (clientX - rect.left) / rect.width;
        if (x < 0.5 - STICK_DEAD) return -1;
        if (x > 0.5 + STICK_DEAD) return 1;
        return 0;
      }

      function stickFromPointer(clientX, clientY) {
        const rect = thumbstickEl.getBoundingClientRect();
        const nx = (clientX - rect.left) / rect.width - 0.5;
        const ny = (clientY - rect.top) / rect.height - 0.5;
        const ax = Math.abs(nx);
        const ay = Math.abs(ny);
        if (ax < STICK_DEAD * 0.45 && ay < STICK_DEAD * 0.45) return { x: 0, y: 0 };
        if (ax >= ay) return { x: nx < 0 ? -1 : 1, y: 0 };
        return { x: 0, y: ny < 0 ? -1 : 1 };
      }

      function updateStickFromPointer(clientX, clientY) {
        if (usingLevel2Stick()) {
          const next = stickFromPointer(clientX, clientY);
          if (stickDir === next.x && stickDirY === next.y) return;
          stickDir = next.x;
          stickDirY = next.y;
        } else {
          const next = stickFromClientX(clientX);
          if (stickDir === next) return;
          stickDir = next;
          stickDirY = 0;
        }
        paintThumbstick();

          window.removeEventListener("pointerup", onStickEnd);
          window.removeEventListener("pointercancel", onStickEnd);

        function onStickMove(e) {
          if (e.pointerId !== stickPointerId) return;
          updateStickFromPointer(e.clientX, e.clientY);

        function onStickEnd(e) {
          endStick(e.pointerId);

        const map = new Uint8Array(width * height);
        for (const [y, x0, x1] of segments) {

      function buildZooxSolidMap(source, margin) {
        const out = new Uint8Array(W * H);
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (!source[y * W + x]) continue;
            for (let dy = -margin; dy <= margin; dy++) {
              for (let dx = -margin; dx <= margin; dx++) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < W && ny >= 0 && ny < H) out[ny * W + nx] = 1;
              }
            }
          }
        }
        return out;
      }

      function findSurfaceAt(map, x, minY = 0) {
        for (let y = minY; y < H - 1; y++) {
          if (map[y * W + x] && !map[(y - 1) * W + x] && map[(y + 1) * W + x]) return y;
        }
        return null;
      }

      function spriteMaxDy(pixels) {
        let maxDy = 0;
        for (const [, dy] of pixels) if (dy > maxDy) maxDy = dy;
        return maxDy;
      }

      function vehicleYOnSurface(surfaceY, pixels) {
        return surfaceY - spriteMaxDy(pixels) - 1;
      }

      function findDropColumn(map, width, height) {
        const mid = Math.floor(width / 2);
        let centerGap = height;
        for (let y = 0; y < height; y++) {
          if (map[y * width + mid]) {
            centerGap = y;
            break;
          }
        }
        if (centerGap >= 100) return mid;

        let bestX = mid;
        let bestGap = 0;
        for (let x = 80; x < width - 80; x += 8) {
          let first = height;
          for (let y = 0; y < height; y++) {
            if (map[y * width + x]) {
              first = y;
              break;
            }
          }
          if (first > bestGap) {
            bestGap = first;
            bestX = x;
          }
        }
        return bestX;
      }

      function findPlatformCenterX(surfaceY) {
        let x0 = W;
        let x1 = 0;
        for (let x = 0; x < W; x++) {
          if (solid[surfaceY * W + x]) {
            x0 = Math.min(x0, x);
            x1 = Math.max(x1, x);
          }
        }
        if (x1 < x0) return Math.floor(W / 2);
        return Math.floor((x0 + x1) / 2);
      }

      function resolveCapriSpawn() {
        const probeX = Math.floor(W / 2);
        const minY = Math.floor(H * 0.38);
        const surfaceY = findSurfaceAt(solid, probeX, minY);
        dropX = surfaceY ? findPlatformCenterX(surfaceY) : probeX;
        const seatY = findSurfaceAt(solid, dropX, minY) || surfaceY;
        let y = seatY ? vehicleYOnSurface(seatY, carPixelsLeft) : CAR_HH;
        for (let i = 0; i < CAR_H; i++) {
          if (vehicleFits(dropX, y, carPixelsLeft)) break;
          y -= 1;
        }
        dropY = y;
      }

      function createBall() {
        if (isWrap()) {
          return {
            x: W / 2,
            y: CAR_HH,
            spawnX: W / 2,
            spawnY: CAR_HH,
            vy: 0,
            vx: mode === "wrap-left" ? -WRAP_SPEED : WRAP_SPEED,
            restTimer: 0,
            wrapCount: 0,
            alive: true,
            hitCooldown: 0,
          };
        }
        return {
          x: dropX,
          y: dropY,
          spawnX: dropX,
          spawnY: dropY,
          vy: 0,
          vx: 0,
          restTimer: 0,
          wrapCount: 0,
          alive: true,
          hitCooldown: 0,
          level2Facing: "front",

      }

        ball.alive = true;
        ball.hitCooldown = 0;
        ball.x = ball.spawnX;
        ball.y = ball.spawnY;
        ball.vy = 0;
        ball.vx = isWrap() ? (mode === "wrap-left" ? -WRAP_SPEED : WRAP_SPEED) : 0;

          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${url}`));
          img.src = url;

      function drawCapriLeft(ctx, w, h) {

        ctx.beginPath();

        ctx.lineTo(50, bottom - 34);
        ctx.lineTo(54, bottom - 22);

        ctx.beginPath();

      function drawZooxLeft(ctx, w, h) {

          }
          ctx.fillStyle = "#9aa4b2";

          ctx.arc(cx, bottom - 1, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }

        const bodyGrad = ctx.createLinearGradient(0, bodyBottom - 40, 0, bodyBottom);
        bodyGrad.addColorStop(0, mintHi);
        bodyGrad.addColorStop(0.45, mint);
        bodyGrad.addColorStop(1, mintLo);

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.moveTo(4, bodyBottom);
        ctx.lineTo(4, bodyBottom - 10);
        ctx.quadraticCurveTo(4, bodyBottom - 38, 12, bodyBottom - 40);
        ctx.lineTo(w - 12, bodyBottom - 40);
        ctx.quadraticCurveTo(w - 4, bodyBottom - 38, w - 4, bodyBottom - 10);
        ctx.lineTo(w - 4, bodyBottom);
        ctx.lineTo(rearWheelX + 11, bodyBottom);
        ctx.quadraticCurveTo(w * 0.5, bodyBottom - 7, frontWheelX - 11, bodyBottom);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = glassLo;
        ctx.beginPath();
        ctx.moveTo(10, bodyBottom - 37);
        ctx.lineTo(w - 10, bodyBottom - 37);
        ctx.lineTo(w - 10, bodyBottom - 13);
        ctx.lineTo(10, bodyBottom - 13);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = glass;
        ctx.fillRect(12, bodyBottom - 36, w - 24, 22);
        ctx.fillStyle = glassHi;
        ctx.fillRect(14, bodyBottom - 35, 18, 8);
        ctx.fillRect(w - 32, bodyBottom - 35, 18, 8);
        ctx.fillStyle = black;
        ctx.fillRect(Math.floor(w / 2) - 5, bodyBottom - 36, 10, 23);
        ctx.fillStyle = "#242428";
        ctx.fillRect(Math.floor(w / 2) - 1, bodyBottom - 34, 2, 19);
        ctx.strokeStyle = "#2a3a44";
        ctx.lineWidth = 0.75;
        ctx.strokeRect(12, bodyBottom - 36, w - 24, 22);
        ctx.strokeStyle = "rgba(180,220,255,0.12)";
        ctx.beginPath();
        ctx.moveTo(24, bodyBottom - 24);
        ctx.lineTo(w - 24, bodyBottom - 24);
        ctx.stroke();

        ctx.fillStyle = sensor;
        ctx.fillRect(7, bodyBottom - 44, 10, 5);
        ctx.fillRect(w - 17, bodyBottom - 44, 10, 5);
        ctx.fillStyle = sensorHi;
        ctx.fillRect(8, bodyBottom - 43, 4, 2);
        ctx.fillRect(w - 16, bodyBottom - 43, 4, 2);

        function drawEndCap(x, facingLeft) {
          const x0 = facingLeft ? x : x - 6;

        ctx.lineTo(w - 14, bodyBottom - 40);

      function extractCarPixels(canvas) {
        const w = canvas.width;
        const h = canvas.height;
        const data = canvas.getContext("2d").getImageData(0, 0, w, h).data;
        const pixels = [];
        const cx = w / 2;
        const cy = h / 2;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (data[(y * w + x) * 4 + 3] > 32) {
              pixels.push([Math.round(x - cx), Math.round(y - cy)]);
            }
          }
        }
        return pixels;
      }

      function shrinkCarPixels(pixels, insetX, insetY) {
        if (!pixels.length || (insetX <= 0 && insetY <= 0)) return pixels;
        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;
        for (const [dx, dy] of pixels) {
          minX = Math.min(minX, dx);
          maxX = Math.max(maxX, dx);
          minY = Math.min(minY, dy);
          maxY = Math.max(maxY, dy);
        }
        return pixels.filter(
          ([dx, dy]) =>
            dx > minX + insetX &&
            dx < maxX - insetX &&
            dy > minY + insetY &&
            dy < maxY - insetY,
        );
      }

      function buildCapri() {
        const left = document.createElement("canvas");
        left.width = CAR_W;
        left.height = CAR_H;
        drawCapriLeft(left.getContext("2d"), CAR_W, CAR_H);
        carSpriteLeft = left;
        carPixelsLeft = extractCarPixels(left);

        const right = document.createElement("canvas");
        right.width = CAR_W;
        right.height = CAR_H;
        const rctx = right.getContext("2d");
        rctx.translate(CAR_W, 0);
        rctx.scale(-1, 1);
        rctx.drawImage(left, 0, 0);
        carSpriteRight = right;
        carPixelsRight = carPixelsLeft.map(([dx, dy]) => [-dx, dy]);
      }

      function buildLevel2Capri() {
        const baseW = 30;
        const baseH = 48;

        function makeSprite(drawFn) {
          const canvas = document.createElement("canvas");
          canvas.width = LEVEL2_CAR_W;
          canvas.height = LEVEL2_CAR_H;
          const cctx = canvas.getContext("2d");
          cctx.scale(LEVEL2_CAR_W / baseW, LEVEL2_CAR_H / baseH);
          drawFn(cctx, baseW, baseH);
          return canvas;
        }

        level2CarFront = makeSprite(drawCapriFront);
        level2PixelsFront = extractCarPixels(level2CarFront);
        level2WallPixelsFront = shrinkCarPixels(level2PixelsFront, 1, 3);
        level2CarRear = makeSprite(drawCapriRear);
        level2PixelsRear = extractCarPixels(level2CarRear);
        level2WallPixelsRear = shrinkCarPixels(level2PixelsRear, 1, 3);
        level2CarSide = makeSprite(drawCapriSideTop);
        level2PixelsSide = extractCarPixels(level2CarSide);
        level2WallPixelsSide = shrinkCarPixels(level2PixelsSide, 5, 2);
      }

      function level2CarBundle() {
        const facing = ball?.level2Facing || "front";
        if (facing === "rear") {
          return {
            sprite: level2CarRear,
            pixels: level2PixelsRear,
            wallPixels: level2WallPixelsRear,
            w: LEVEL2_CAR_W,
            h: LEVEL2_CAR_H,
          };
        }
        if (facing === "side") {
          return {
            sprite: level2CarSide,
            pixels: level2PixelsSide,
            wallPixels: level2WallPixelsSide,
            w: LEVEL2_CAR_W,
            h: LEVEL2_CAR_H,
          };
        }
        return {
          sprite: level2CarFront,
          pixels: level2PixelsFront,
          wallPixels: level2WallPixelsFront,
          w: LEVEL2_CAR_W,
          h: LEVEL2_CAR_H,
        };
      }

      const canvas = document.getElementById("view");
      const ctx = canvas.getContext("2d");
      const statusEl = document.getElementById("status");
      const timerEl = document.getElementById("timer");

      let W = 1536;
      let H = 1024;
      let gravity = 512;
      let background = null;
      let solid = null;
      let ready = false;
      let fallElapsed = 0;
      let restTimer = 0;
      let dropX = 768;

      const ball = { x: 0, y: 0, vy: 0, r: 14 };

      function buildSolidMap(segments, width, height) {
        const map = new Uint8Array(width * height);
        for (const [y, x0, x1] of segments) {
          const row = y * width;
          for (let x = x0; x <= x1; x++) map[row + x] = 1;
        }
        return map;
      }

      function findDropColumn(map, width, height) {
        const mid = Math.floor(width / 2);
        let centerGap = height;
        for (let y = 0; y < height; y++) {
          if (map[y * width + mid]) {
            centerGap = y;
            break;
          }
        }
        if (centerGap >= 100) return mid;

        let bestX = mid;
        let bestGap = 0;
        for (let x = 80; x < width - 80; x += 8) {
          let first = height;
          for (let y = 0; y < height; y++) {
            if (map[y * width + x]) {
              first = y;
              break;
            }
          }
          if (first > bestGap) {
            bestGap = first;
            bestX = x;
          }
        }
        return bestX;
      }

      function resetBall() {
        ball.x = dropX;
        ball.y = ball.r;
        ball.vy = 0;
        fallElapsed = 0;
        restTimer = 0;
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`Failed to load ${src}`));
          img.src = src;
        });
      }

      function isSolid(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        if (ix < 0 || iy < 0 || ix >= W || iy >= H) return false;
        return solid[iy * W + ix] === 1;
      }

      function landOnPlatforms(dt) {
        if (ball.vy <= 0) return;

        const cx = Math.round(ball.x);
        const footY = ball.y + ball.r;
        const nextFoot = footY + ball.vy * dt;
        let surface = null;

        for (let y = Math.floor(footY); y <= Math.ceil(nextFoot); y++) {
          if (!isSolid(cx, y)) continue;
          surface = y;
          break;
        }

        if (surface !== null) {
          ball.y = surface - ball.r - 0.01;
          ball.vy = 0;
        }
      }

      function pushOutOfSolids() {
        if (!isSolid(ball.x, ball.y)) return;
        for (let y = Math.floor(ball.y - ball.r); y <= Math.ceil(ball.y + ball.r); y++) {
          for (let x = Math.floor(ball.x - ball.r); x <= Math.ceil(ball.x + ball.r); x++) {
            if (!isSolid(x, y)) continue;
            ball.y = y - ball.r - 0.01;
            ball.vy = 0;
            return;
          }
        }
      }

      function restingOnSolid() {
        return isSolid(ball.x, ball.y + ball.r + 1)
          || isSolid(ball.x - ball.r * 0.5, ball.y + ball.r + 1)
          || isSolid(ball.x + ball.r * 0.5, ball.y + ball.r + 1);
      }

      function step(dt) {
        fallElapsed += dt;
        ball.vy += gravity * dt;
        ball.y += ball.vy * dt;
        landOnPlatforms(dt);
        pushOutOfSolids();

        if (ball.vy === 0 && restingOnSolid()) {
          restTimer += dt;
          if (restTimer > 2.5) resetBall();
        } else {
          restTimer = 0;
        }

        timerEl.textContent = `${Math.min(fallElapsed, FALL_SECONDS).toFixed(2)}s / ${FALL_SECONDS.toFixed(2)}s`;
      }

      function drawFrame() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        if (background) ctx.drawImage(background, 0, 0, W, H);

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ff3b3b";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      let lastFrame = 0;

      function tick(now) {
        if (!ready) {
          requestAnimationFrame(tick);
          return;
        }
        if (!lastFrame) lastFrame = now;
        const dt = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        step(dt);
        drawFrame();
        requestAnimationFrame(tick);
      }

      async function init() {
        if (BG_DATA_URL && !BG_DATA_URL.startsWith("__")) {
          background = await loadImage(BG_DATA_URL);
        } else {
          const base = new URL("./assets/", window.location.href);
          for (const name of ["arena-bg.jpg", "arena-source.png"]) {
            try {
              background = await loadImage(new URL(name, base).href);
              break;
            } catch {
              // try next
            }
          }
        }
        if (!background) throw new Error("Background image missing");

        W = background.naturalWidth;
        H = background.naturalHeight;
        gravity = H / (0.5 * FALL_SECONDS * FALL_SECONDS);
        solid = buildSolidMap(SOLID_SEGMENTS, W, H);
        dropX = findDropColumn(solid, W, H);
        canvas.width = W;
        canvas.height = H;
        resetBall();
        ready = true;
        statusEl.style.display = "none";
        lastFrame = 0;
        requestAnimationFrame(tick);
        drawFrame();
      }

      init().catch((err) => {
        statusEl.textContent = `Failed to load: ${err.message}`;
      });
    </script>

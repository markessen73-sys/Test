        const titleMusic = createSampleVoice(HYPNOTIZED_MUSIC_DATA_URL, "__HYPNOTIZED_MUSIC");
        const vegasMusic = createSampleVoice(VEGAS_MUSIC_DATA_URL, "__VEGAS_MUSIC");
        const levelTwoMusic = createSampleVoice(ROYAL_BAROQUE_MUSIC_DATA_URL, "__ROYAL_BAROQUE_MUSIC");

        let titleAudio = null;
        let titleMusicPending = false;
        let titleMusicEpoch = 0;
        let allowTitleMusic = false;
        let vegasMusicSource = null;
        let vegasMusicStarted = false;
        let vegasMusicPending = false;
        let levelTwoMusicSource = null;
        let levelTwoMusicStarted = false;
        let levelTwoMusicPending = false;

        function unlockAudio(ac) {
          if (!ac) return Promise.resolve(false);
          if (ac.state === "running") return Promise.resolve(true);
          return ac.resume().then(() => ac.state === "running");
        }

        function ensureTitleAudio() {
          if (!titleMusic.enabled) return null;
          if (!titleAudio) {
            titleAudio = new Audio(resolveAssetSrc(HYPNOTIZED_MUSIC_DATA_URL));
            titleAudio.loop = true;
            titleAudio.volume = 0.16;
            titleAudio.preload = "auto";
          }
          return titleAudio;
        }

        function isTitleMusicPlaying() {
          return Boolean(titleAudio && !titleAudio.paused);
        }

        function tryPlayTitleMusic() {
          if (!allowTitleMusic) return Promise.resolve(false);
          const audio = ensureTitleAudio();
          if (!audio) return Promise.resolve(false);
          const epoch = titleMusicEpoch;
          return audio
            .play()
            .then(() => {
              if (!allowTitleMusic || epoch !== titleMusicEpoch) {
                audio.pause();
                audio.currentTime = 0;
                return false;
              }
              titleMusicPending = false;
              return true;
            })
            .catch(() => {
              if (epoch === titleMusicEpoch) titleMusicPending = true;
              return false;
            });
        }

        function unlockTitleMusicFromGesture() {
          allowTitleMusic = true;
          titleMusicEpoch++;
          const audio = ensureTitleAudio();
          if (!audio) return false;
          const playPromise = audio.play();
          titleMusicPending = false;
          if (playPromise) {
            playPromise.catch(() => {
              titleMusicPending = true;
            });
          }
          return true;
        }

        function stopTitleMusic() {
          titleMusicEpoch++;
          allowTitleMusic = false;
          titleMusicPending = false;
          if (titleAudio) {
            titleAudio.pause();
            titleAudio.currentTime = 0;
          }
        }

        function beginTitleScreens() {
          allowTitleMusic = true;
          titleMusicEpoch++;
          return tryPlayTitleMusic();
        }

        function unlockTitleMusic() {
          if (!allowTitleMusic || isTitleMusicPlaying()) return Promise.resolve(isTitleMusicPlaying());
          return tryPlayTitleMusic();
        }

        function startLoopingTrack(ac, voice, getSource, setSource, getStarted, setStarted, getPending, setPending) {
          if (!musicBus || !voice.enabled) return Promise.resolve();
          if (getStarted() && getSource()) return Promise.resolve();

          return unlockAudio(ac).then((running) =>
            voice.loadSample(ac).then((buf) => {
              if (!buf || !musicBus) return;
              if (!running) {
                setPending(true);
                return;
              }
              const prev = getSource();
              if (prev) {
                try {
                  prev.stop();
                } catch (_) {}
              }
              const src = ac.createBufferSource();
              src.buffer = buf;
              src.loop = true;
              src.connect(musicBus);
              src.start(0);
              setSource(src);
              setStarted(true);
              setPending(false);
            }),
          );
        }

        function startVegasMusic(ac) {
          return startLoopingTrack(
            ac,
            vegasMusic,
            () => vegasMusicSource,
            (v) => {
              vegasMusicSource = v;
            },
            () => vegasMusicStarted,
            (v) => {
              vegasMusicStarted = v;
            },
            () => vegasMusicPending,
            (v) => {
              vegasMusicPending = v;
            },
          );
        }

        function stopVegasMusic() {
          if (vegasMusicSource) {
            try {
              vegasMusicSource.stop();
            } catch (_) {}
            vegasMusicSource = null;
          }
          vegasMusicStarted = false;
          vegasMusicPending = false;
        }

        function stopLevelTwoMusic() {
          if (levelTwoMusicSource) {
            try {
              levelTwoMusicSource.stop();
            } catch (_) {}
            levelTwoMusicSource = null;
          }
          levelTwoMusicStarted = false;
          levelTwoMusicPending = false;
        }

        function stopGameMusic() {
          stopVegasMusic();
          stopLevelTwoMusic();
        }

        function startLevelTwoMusic() {
          stopTitleMusic();
          stopVegasMusic();
          const ac = ensure();
          if (!ac) return Promise.resolve();
          return unlockAudio(ac).then((running) => {
            if (!running) {
              levelTwoMusicPending = true;
              return;
            }
            return startLoopingTrack(
              ac,
              levelTwoMusic,
              () => levelTwoMusicSource,
              (v) => {
                levelTwoMusicSource = v;
              },
              () => levelTwoMusicStarted,
              (v) => {
                levelTwoMusicStarted = v;
              },
              () => levelTwoMusicPending,
              (v) => {
                levelTwoMusicPending = v;
              },
            );
          });
        }

        function startGameMusic() {
          stopTitleMusic();
          stopLevelTwoMusic();
          const ac = ensure();
          if (!ac) return Promise.resolve();
          return unlockAudio(ac).then((running) => {
            if (!running) {
              vegasMusicPending = true;
              return;
            }
            return startVegasMusic(ac);
          });
        }

        function playZapSynth(ac, now) {
          const duration = 0.24;
          const master = ac.createGain();
          master.gain.setValueAtTime(0.75, now);
          master.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          master.connect(outBus(ac));

          const bufferSize = Math.floor(ac.sampleRate * duration);
          const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
          }
          const noise = ac.createBufferSource();
          noise.buffer = buffer;
          const hp = ac.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 1400;
          const bp = ac.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 4200;
          bp.Q.value = 1.2;
          noise.connect(hp);
          hp.connect(bp);
          bp.connect(master);
          noise.start(now);
          noise.stop(now + duration);

          for (let i = 0; i < 5; i++) {
            const arc = ac.createOscillator();
            arc.type = "square";
            arc.frequency.setValueAtTime(700 + Math.random() * 2800, now + i * 0.018);
            const arcGain = ac.createGain();
            arcGain.gain.setValueAtTime(0.12, now + i * 0.018);
            arcGain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.018 + 0.05);
            arc.connect(arcGain);
            arcGain.connect(master);
            arc.start(now + i * 0.018);
            arc.stop(now + i * 0.018 + 0.06);
          }
        }

        function playZap() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;
          if (now - lastZap < 0.05) return;
          lastZap = now;

          if (beep.enabled) {
            beep.play(ac, now, 0.9, false);
            return;
          }

          playZapSynth(ac, now);
        }

        function playKerchingSynth(ac, now) {
          const ding = ac.createOscillator();
          ding.type = "sine";
          ding.frequency.setValueAtTime(2100, now);
          ding.frequency.exponentialRampToValueAtTime(3200, now + 0.04);
          const dingGain = ac.createGain();
          dingGain.gain.setValueAtTime(0.0001, now);
          dingGain.gain.exponentialRampToValueAtTime(0.42, now + 0.008);
          dingGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
          ding.connect(dingGain);
          dingGain.connect(outBus(ac));
          ding.start(now);
          ding.stop(now + 0.36);

          const coin = ac.createOscillator();
          coin.type = "triangle";
          coin.frequency.setValueAtTime(3800, now + 0.05);
          const coinGain = ac.createGain();
          coinGain.gain.setValueAtTime(0.0001, now + 0.05);
          coinGain.gain.exponentialRampToValueAtTime(0.28, now + 0.06);
          coinGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
          coin.connect(coinGain);
          coinGain.connect(outBus(ac));
          coin.start(now + 0.05);
          coin.stop(now + 0.43);

          const register = ac.createOscillator();
          register.type = "square";
          register.frequency.value = 1200;
          const regGain = ac.createGain();
          regGain.gain.setValueAtTime(0.0001, now + 0.1);
          regGain.gain.exponentialRampToValueAtTime(0.14, now + 0.11);
          regGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          register.connect(regGain);
          regGain.connect(outBus(ac));
          register.start(now + 0.1);
          register.stop(now + 0.3);
        }

        function playKerching() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;

          if (pew.enabled) {
            pew.play(ac, now, 0.9, false);
            return;
          }

          playKerchingSynth(ac, now);
        }

        function playCrashSynth(ac, now) {
          const bus = outBus(ac);
          const dur = 1.05;

          const master = ac.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.exponentialRampToValueAtTime(0.95, now + 0.02);
          master.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          master.connect(bus);

          const bufferSize = Math.floor(ac.sampleRate * dur);
          const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const env = 1 - i / bufferSize;
            data[i] = (Math.random() * 2 - 1) * env * env;
          }
          const noise = ac.createBufferSource();
          noise.buffer = buffer;
          const hp = ac.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 400;
          const lp = ac.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.setValueAtTime(4200, now);
          lp.frequency.exponentialRampToValueAtTime(180, now + dur);
          noise.connect(hp);
          hp.connect(lp);
          lp.connect(master);
          noise.start(now);
          noise.stop(now + dur);

          const thump = ac.createOscillator();
          thump.type = "sine";
          thump.frequency.setValueAtTime(110, now);
          thump.frequency.exponentialRampToValueAtTime(42, now + 0.35);
          const thumpGain = ac.createGain();
          thumpGain.gain.setValueAtTime(0.7, now);
          thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
          thump.connect(thumpGain);
          thumpGain.connect(bus);
          thump.start(now);
          thump.stop(now + 0.52);
        }

        function playCrash() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;
          if (carCrash.enabled) {
            carCrash.play(ac, now, 0.95, false, () => playCrashSynth(ac, now));
            return;
          }
          playCrashSynth(ac, now);
        }

        async function preloadSfx() {
          const ac = ensure();
          if (!ac) return;
          const loads = [];
          if (pew.enabled) loads.push(pew.loadSample(ac));
          if (beep.enabled) loads.push(beep.loadSample(ac));
          if (carCrash.enabled) loads.push(carCrash.loadSample(ac));
          await Promise.all(loads);
        }

        function preloadTitleMusic() {
          const audio = ensureTitleAudio();
          if (!audio) return Promise.resolve();
          audio.load();

        }

        function preloadVegasMusic() {
          const ac = ensure();

          return vegasMusic.loadSample(ac);
        }

        function preloadLevelTwoMusic() {
          const ac = ensure();
          if (!ac || !levelTwoMusic.enabled) return Promise.resolve();
          return levelTwoMusic.loadSample(ac);
        }

        function preloadMusic() {
          return Promise.all([preloadTitleMusic(), preloadVegasMusic(), preloadLevelTwoMusic()]);
        }

        function resume() {
          const ac = ensure();
          if (allowTitleMusic && titleMusicPending) void unlockTitleMusic();
          if (ac && vegasMusicPending) void startVegasMusic(ac);
          if (ac && levelTwoMusicPending) void startLevelTwoMusic();
          return ac;
        }

        return {
          resume,
          preloadSfx,
          preloadMusic,
          preloadTitleMusic,
          preloadVegasMusic,
          preloadLevelTwoMusic,
          beginTitleScreens,
          unlockTitleMusic,
          unlockTitleMusicFromGesture,
          hasTitleMusic: () => titleMusic.enabled,
          isTitleMusicPlaying,
          isTitleMusicPending: () => titleMusicPending,
          startGameMusic,
          startLevelTwoMusic,
          stopGameMusic,
          playZap,
          playKerching,
          playCrash,
        };
      }

      const sfx = createArenaAudio();

      function isLandscapePhone() {

      const STICK_DRIFT_GAIN = 1.9;

      let stickDirY = 0;
      let stickPointerId = null;
      const STICK_DEAD = 0.22;

      function usingLevel2Stick() {
        return currentLevel === 2 && gamePhase === "playing";
      }

      function paintThumbstick() {
        thumbstickEl.classList.toggle("left", stickDir < 0 && !stickDirY);
        thumbstickEl.classList.toggle("right", stickDir > 0 && !stickDirY);
        thumbstickEl.classList.toggle("up", stickDirY < 0);
        thumbstickEl.classList.toggle("down", stickDirY > 0);
        thumbstickEl.setAttribute(
          "aria-label",
          usingLevel2Stick() ? "Hold for up, down, left, or right" : "Hold left or right",
        );
        thumbstickEl.setAttribute("aria-valuenow", String(stickDir || stickDirY));
      }

      function stickFromClientX(clientX) {
        const rect = thumbstickEl.getBoundingClientRect();
        const x = (clientX - rect.left) / rect.width;
        if (x < 0.5 - STICK_DEAD) return -1;
        if (x > 0.5 + STICK_DEAD) return 1;
        return 0;
      }

      function stickFromPointer(clientX, clientY) {
        const rect = thumbstickEl.getBoundingClientRect();
        const nx = (clientX - rect.left) / rect.width - 0.5;
        const ny = (clientY - rect.top) / rect.height - 0.5;
        const ax = Math.abs(nx);
        const ay = Math.abs(ny);
        if (ax < STICK_DEAD * 0.45 && ay < STICK_DEAD * 0.45) return { x: 0, y: 0 };
        if (ax >= ay) return { x: nx < 0 ? -1 : 1, y: 0 };
        return { x: 0, y: ny < 0 ? -1 : 1 };
      }

      function updateStickFromPointer(clientX, clientY) {
        if (usingLevel2Stick()) {
          const next = stickFromPointer(clientX, clientY);
          if (stickDir === next.x && stickDirY === next.y) return;
          stickDir = next.x;
          stickDirY = next.y;
        } else {
          const next = stickFromClientX(clientX);
          if (stickDir === next) return;
          stickDir = next;
          stickDirY = 0;
        }
        paintThumbstick();
      }

      function resetStick() {
        stickDir = 0;
        stickDirY = 0;
        paintThumbstick();
      }

      function bindThumbstick() {
        function endStick(pointerId) {
          if (stickPointerId !== pointerId) return;
          stickPointerId = null;
          resetStick();
          window.removeEventListener("pointermove", onStickMove);
          window.removeEventListener("pointerup", onStickEnd);
          window.removeEventListener("pointercancel", onStickEnd);
        }

        function onStickMove(e) {
          if (e.pointerId !== stickPointerId) return;
          updateStickFromPointer(e.clientX, e.clientY);
        }

        function onStickEnd(e) {
          endStick(e.pointerId);
        }

        thumbstickEl.addEventListener("pointerdown", (e) => {
          if (thumbstickEl.classList.contains("is-disabled")) return;
          if (stickPointerId !== null) return;
          stickPointerId = e.pointerId;
          updateStickFromPointer(e.clientX, e.clientY);
          window.addEventListener("pointermove", onStickMove);
          window.addEventListener("pointerup", onStickEnd);
          window.addEventListener("pointercancel", onStickEnd);
        });

      function buildSolidMap(segments, width, height) {
        const map = new Uint8Array(width * height);
        for (const [y, x0, x1] of segments) {
          const row = y * width;
          for (let x = x0; x <= x1; x++) map[row + x] = 1;
        }
        return map;
      }

      function buildZooxSolidMap(source, margin) {
        const out = new Uint8Array(W * H);
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (!source[y * W + x]) continue;
            for (let dy = -margin; dy <= margin; dy++) {
              for (let dx = -margin; dx <= margin; dx++) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < W && ny >= 0 && ny < H) out[ny * W + nx] = 1;
              }
            }
          }
        }
        return out;
      }

      function findSurfaceAt(map, x, minY = 0) {
        for (let y = minY; y < H - 1; y++) {
          if (map[y * W + x] && !map[(y - 1) * W + x] && map[(y + 1) * W + x]) return y;
        }
        return null;
      }

      function spriteMaxDy(pixels) {
        let maxDy = 0;
        for (const [, dy] of pixels) if (dy > maxDy) maxDy = dy;
        return maxDy;
      }

      function vehicleYOnSurface(surfaceY, pixels) {
        return surfaceY - spriteMaxDy(pixels) - 1;
      }

      function findDropColumn(map, width, height) {
        const mid = Math.floor(width / 2);
        let centerGap = height;
        for (let y = 0; y < height; y++) {
          if (map[y * width + mid]) {
            centerGap = y;
            break;
          }
        }
        if (centerGap >= 100) return mid;

        let bestX = mid;
        let bestGap = 0;
        for (let x = 80; x < width - 80; x += 8) {
          let first = height;
          for (let y = 0; y < height; y++) {
            if (map[y * width + x]) {
              first = y;
              break;
            }
          }
          if (first > bestGap) {
            bestGap = first;
            bestX = x;
          }
        }
        return bestX;
      }

      function findPlatformCenterX(surfaceY) {
        let x0 = W;
        let x1 = 0;
        for (let x = 0; x < W; x++) {
          if (solid[surfaceY * W + x]) {
            x0 = Math.min(x0, x);
            x1 = Math.max(x1, x);
          }
        }
        if (x1 < x0) return Math.floor(W / 2);
        return Math.floor((x0 + x1) / 2);
      }

      function resolveCapriSpawn() {
        const probeX = Math.floor(W / 2);
        const minY = Math.floor(H * 0.38);
        const surfaceY = findSurfaceAt(solid, probeX, minY);
        dropX = surfaceY ? findPlatformCenterX(surfaceY) : probeX;
        const seatY = findSurfaceAt(solid, dropX, minY) || surfaceY;
        let y = seatY ? vehicleYOnSurface(seatY, carPixelsLeft) : CAR_HH;
        for (let i = 0; i < CAR_H; i++) {
          if (vehicleFits(dropX, y, carPixelsLeft)) break;
          y -= 1;
        }
        dropY = y;
      }

      function extractCarPixels(canvas) {
        const w = canvas.width;
        const h = canvas.height;
        const data = canvas.getContext("2d").getImageData(0, 0, w, h).data;
        const pixels = [];
        const cx = w / 2;
        const cy = h / 2;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (data[(y * w + x) * 4 + 3] > 32) {
              pixels.push([Math.round(x - cx), Math.round(y - cy)]);
            }
          }
        }
        return pixels;
      }

      function shrinkCarPixels(pixels, insetX, insetY) {
        if (!pixels.length || (insetX <= 0 && insetY <= 0)) return pixels;
        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;
        for (const [dx, dy] of pixels) {
          minX = Math.min(minX, dx);
          maxX = Math.max(maxX, dx);
          minY = Math.min(minY, dy);
          maxY = Math.max(maxY, dy);
        }
        return pixels.filter(
          ([dx, dy]) =>
            dx > minX + insetX &&
            dx < maxX - insetX &&
            dy > minY + insetY &&
            dy < maxY - insetY,
        );
      }

      function buildCapri() {
        const left = document.createElement("canvas");
        left.width = CAR_W;
        left.height = CAR_H;
        drawCapriLeft(left.getContext("2d"), CAR_W, CAR_H);
        carSpriteLeft = left;
        carPixelsLeft = extractCarPixels(left);

        const right = document.createElement("canvas");
        right.width = CAR_W;
        right.height = CAR_H;
        const rctx = right.getContext("2d");
        rctx.translate(CAR_W, 0);
        rctx.scale(-1, 1);
        rctx.drawImage(left, 0, 0);
        carSpriteRight = right;
        carPixelsRight = carPixelsLeft.map(([dx, dy]) => [-dx, dy]);
      }

      function drawCapriRear(ctx, w, h) {

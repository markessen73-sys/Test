      function createArenaAudio() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let ctx = null;
        let sfxBus = null;
        let musicBus = null;
        let lastZap = 0;

        function ensure() {
          if (!AudioCtx) return null;
          if (!ctx) {
            ctx = new AudioCtx();
            sfxBus = ctx.createGain();
            sfxBus.gain.value = 1;
            sfxBus.connect(ctx.destination);
            musicBus = ctx.createGain();
            musicBus.gain.value = 0.16;
            musicBus.connect(ctx.destination);
          }
          if (ctx.state === "suspended") ctx.resume();
          return ctx;
        }

        function outBus(ac) {
          ensure();
          return sfxBus ?? ac.destination;
        }

        function resolveAssetSrc(src) {
          return resolveAssetUrl(src);
        }

        function createSampleVoice(src, placeholder) {
          let buffer = null;
          let load = null;
          const enabled = src && !src.startsWith(placeholder);

          function loadSample(ac) {
            if (buffer) return Promise.resolve(buffer);
            if (load) return load;
            load = fetch(resolveAssetSrc(src))
              .then((res) => res.arrayBuffer())
              .then((arr) => ac.decodeAudioData(arr))
              .then((buf) => {
                buffer = buf;
                return buf;
              })
              .catch(() => null);
            return load;
          }

          function play(ac, now, volume, fadeOut, onMiss) {
            const start = (buf) => {
              const playDur = buf.duration;
              const voice = ac.createBufferSource();
              voice.buffer = buf;
              const gain = ac.createGain();
              gain.gain.setValueAtTime(volume, now);
              if (fadeOut) {
                const fadeTime = Math.min(0.42, Math.max(0.18, playDur * 0.38));
                const fadeStart = Math.max(0, playDur - fadeTime);
                gain.gain.setValueAtTime(volume, now + fadeStart);
                gain.gain.exponentialRampToValueAtTime(0.001, now + playDur);
              }
              voice.connect(gain);
              gain.connect(outBus(ac));
              voice.start(now, 0, playDur);
            };

            if (buffer) {
              start(buffer);
              return;
            }

            loadSample(ac).then((buf) => {
              if (buf) start(buf);
              else if (onMiss) onMiss();
            });
          }

          return { enabled, play, loadSample };
        }

        const pew = createSampleVoice(PEW_DATA_URL, "__PEW");
        const beep = createSampleVoice(BEEP_DATA_URL, "__BEEP");
        const carCrash = createSampleVoice(CAR_CRASH_DATA_URL, "__CAR_CRASH");
        const routemasterBell = createSampleVoice(ROUTEMASTER_BELL_DATA_URL, "__ROUTEMASTER_BELL");
        const titleMusic = createSampleVoice(HYPNOTIZED_MUSIC_DATA_URL, "__HYPNOTIZED_MUSIC");
        const vegasMusic = createSampleVoice(VEGAS_MUSIC_DATA_URL, "__VEGAS_MUSIC");
        const levelTwoMusic = createSampleVoice(ROYAL_BAROQUE_MUSIC_DATA_URL, "__ROYAL_BAROQUE_MUSIC");

        let titleAudio = null;
        let titleMusicPending = false;
        let titleMusicEpoch = 0;
        let allowTitleMusic = false;
        let vegasMusicSource = null;
        let vegasMusicStarted = false;
        let vegasMusicPending = false;
        let levelTwoMusicSource = null;
        let levelTwoMusicStarted = false;
        let levelTwoMusicPending = false;

        function unlockAudio(ac) {
          if (!ac) return Promise.resolve(false);
          if (ac.state === "running") return Promise.resolve(true);
          return ac.resume().then(() => ac.state === "running");
        }

        function ensureTitleAudio() {
          if (!titleMusic.enabled) return null;
          if (!titleAudio) {
            titleAudio = new Audio(resolveAssetSrc(HYPNOTIZED_MUSIC_DATA_URL));
            titleAudio.loop = true;
            titleAudio.volume = 0.16;
            titleAudio.preload = "auto";
          }
          return titleAudio;
        }

        function isTitleMusicPlaying() {
          return Boolean(titleAudio && !titleAudio.paused);
        }

        function tryPlayTitleMusic() {
          if (!allowTitleMusic) return Promise.resolve(false);
          const audio = ensureTitleAudio();
          if (!audio) return Promise.resolve(false);
          const epoch = titleMusicEpoch;
          return audio
            .play()
            .then(() => {
              if (!allowTitleMusic || epoch !== titleMusicEpoch) {
                audio.pause();
                audio.currentTime = 0;
                return false;
              }
              titleMusicPending = false;
              return true;
            })
            .catch(() => {
              if (epoch === titleMusicEpoch) titleMusicPending = true;
              return false;
            });
        }

        function unlockTitleMusicFromGesture() {
          allowTitleMusic = true;
          titleMusicEpoch++;
          const audio = ensureTitleAudio();
          if (!audio) return false;
          const playPromise = audio.play();
          titleMusicPending = false;
          if (playPromise) {
            playPromise.catch(() => {
              titleMusicPending = true;
            });
          }
          return true;
        }

        function stopTitleMusic() {
          titleMusicEpoch++;
          allowTitleMusic = false;
          titleMusicPending = false;
          if (titleAudio) {
            titleAudio.pause();
            titleAudio.currentTime = 0;
          }
        }

        function beginTitleScreens() {
          allowTitleMusic = true;
          titleMusicEpoch++;
          return tryPlayTitleMusic();
        }

        function unlockTitleMusic() {
          if (!allowTitleMusic || isTitleMusicPlaying()) return Promise.resolve(isTitleMusicPlaying());
          return tryPlayTitleMusic();
        }

        function startLoopingTrack(ac, voice, getSource, setSource, getStarted, setStarted, getPending, setPending) {
          if (!musicBus || !voice.enabled) return Promise.resolve();
          if (getStarted() && getSource()) return Promise.resolve();

          return unlockAudio(ac).then((running) =>
            voice.loadSample(ac).then((buf) => {
              if (!buf || !musicBus) return;
              if (!running) {
                setPending(true);
                return;
              }
              const prev = getSource();
              if (prev) {
                try {
                  prev.stop();
                } catch (_) {}
              }
              const src = ac.createBufferSource();
              src.buffer = buf;
              src.loop = true;
              src.connect(musicBus);
              src.start(0);
              setSource(src);
              setStarted(true);
              setPending(false);
            }),
          );
        }

        function startVegasMusic(ac) {
          return startLoopingTrack(
            ac,
            vegasMusic,
            () => vegasMusicSource,
            (v) => {
              vegasMusicSource = v;
            },
            () => vegasMusicStarted,
            (v) => {
              vegasMusicStarted = v;
            },
            () => vegasMusicPending,
            (v) => {
              vegasMusicPending = v;
            },
          );
        }

        function stopVegasMusic() {
          if (vegasMusicSource) {
            try {
              vegasMusicSource.stop();
            } catch (_) {}
            vegasMusicSource = null;
          }
          vegasMusicStarted = false;
          vegasMusicPending = false;
        }

        function stopLevelTwoMusic() {
          if (levelTwoMusicSource) {
            try {
              levelTwoMusicSource.stop();
            } catch (_) {}
            levelTwoMusicSource = null;
          }
          levelTwoMusicStarted = false;
          levelTwoMusicPending = false;
        }

        function stopGameMusic() {
          stopVegasMusic();
          stopLevelTwoMusic();
        }

        function startLevelTwoMusic() {
          stopTitleMusic();
          stopVegasMusic();
          const ac = ensure();
          if (!ac) return Promise.resolve();
          return unlockAudio(ac).then((running) => {
            if (!running) {
              levelTwoMusicPending = true;
              return;
            }
            return startLoopingTrack(
              ac,
              levelTwoMusic,
              () => levelTwoMusicSource,
              (v) => {
                levelTwoMusicSource = v;
              },
              () => levelTwoMusicStarted,
              (v) => {
                levelTwoMusicStarted = v;
              },
              () => levelTwoMusicPending,
              (v) => {
                levelTwoMusicPending = v;
              },
            );
          });
        }

        function startGameMusic() {
          stopTitleMusic();
          stopLevelTwoMusic();
          const ac = ensure();
          if (!ac) return Promise.resolve();
          return unlockAudio(ac).then((running) => {
            if (!running) {
              vegasMusicPending = true;
              return;
            }
            return startVegasMusic(ac);
          });
        }

        function playZapSynth(ac, now) {
          const duration = 0.24;
          const master = ac.createGain();
          master.gain.setValueAtTime(0.75, now);
          master.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          master.connect(outBus(ac));

          const bufferSize = Math.floor(ac.sampleRate * duration);
          const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
          }
          const noise = ac.createBufferSource();
          noise.buffer = buffer;
          const hp = ac.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 1400;
          const bp = ac.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 4200;
          bp.Q.value = 1.2;
          noise.connect(hp);
          hp.connect(bp);
          bp.connect(master);
          noise.start(now);
          noise.stop(now + duration);

          for (let i = 0; i < 5; i++) {
            const arc = ac.createOscillator();
            arc.type = "square";
            arc.frequency.setValueAtTime(700 + Math.random() * 2800, now + i * 0.018);
            const arcGain = ac.createGain();
            arcGain.gain.setValueAtTime(0.12, now + i * 0.018);
            arcGain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.018 + 0.05);
            arc.connect(arcGain);
            arcGain.connect(master);
            arc.start(now + i * 0.018);
            arc.stop(now + i * 0.018 + 0.06);
          }
        }

        function playZap() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;
          if (now - lastZap < 0.05) return;
          lastZap = now;

          if (beep.enabled) {
            beep.play(ac, now, 0.9, false);
            return;
          }

          playZapSynth(ac, now);
        }

        function playKerchingSynth(ac, now) {
          const ding = ac.createOscillator();
          ding.type = "sine";
          ding.frequency.setValueAtTime(2100, now);
          ding.frequency.exponentialRampToValueAtTime(3200, now + 0.04);
          const dingGain = ac.createGain();
          dingGain.gain.setValueAtTime(0.0001, now);
          dingGain.gain.exponentialRampToValueAtTime(0.42, now + 0.008);
          dingGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
          ding.connect(dingGain);
          dingGain.connect(outBus(ac));
          ding.start(now);
          ding.stop(now + 0.36);

          const coin = ac.createOscillator();
          coin.type = "triangle";
          coin.frequency.setValueAtTime(3800, now + 0.05);
          const coinGain = ac.createGain();
          coinGain.gain.setValueAtTime(0.0001, now + 0.05);
          coinGain.gain.exponentialRampToValueAtTime(0.28, now + 0.06);
          coinGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
          coin.connect(coinGain);
          coinGain.connect(outBus(ac));
          coin.start(now + 0.05);
          coin.stop(now + 0.43);

          const register = ac.createOscillator();
          register.type = "square";
          register.frequency.value = 1200;
          const regGain = ac.createGain();
          regGain.gain.setValueAtTime(0.0001, now + 0.1);
          regGain.gain.exponentialRampToValueAtTime(0.14, now + 0.11);
          regGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          register.connect(regGain);
          regGain.connect(outBus(ac));
          register.start(now + 0.1);
          register.stop(now + 0.3);
        }

        function playKerching() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;

          if (pew.enabled) {
            pew.play(ac, now, 0.9, false);
            return;
          }

          playKerchingSynth(ac, now);
        }

        function playCrashSynth(ac, now) {
          const bus = outBus(ac);
          const dur = 1.05;

          const master = ac.createGain();
          master.gain.setValueAtTime(0.0001, now);
          master.gain.exponentialRampToValueAtTime(0.95, now + 0.02);
          master.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          master.connect(bus);

          const bufferSize = Math.floor(ac.sampleRate * dur);
          const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const env = 1 - i / bufferSize;
            data[i] = (Math.random() * 2 - 1) * env * env;
          }
          const noise = ac.createBufferSource();
          noise.buffer = buffer;
          const hp = ac.createBiquadFilter();
          hp.type = "highpass";
          hp.frequency.value = 400;
          const lp = ac.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.setValueAtTime(4200, now);
          lp.frequency.exponentialRampToValueAtTime(180, now + dur);
          noise.connect(hp);
          hp.connect(lp);
          lp.connect(master);
          noise.start(now);
          noise.stop(now + dur);

          const thump = ac.createOscillator();
          thump.type = "sine";
          thump.frequency.setValueAtTime(110, now);
          thump.frequency.exponentialRampToValueAtTime(42, now + 0.35);
          const thumpGain = ac.createGain();
          thumpGain.gain.setValueAtTime(0.7, now);
          thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
          thump.connect(thumpGain);
          thumpGain.connect(bus);
          thump.start(now);
          thump.stop(now + 0.52);
        }

        function playCrash() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;
          if (carCrash.enabled) {
            carCrash.play(ac, now, 0.95, false, () => playCrashSynth(ac, now));
            return;
          }
          playCrashSynth(ac, now);
        }

        async function preloadSfx() {
          const ac = ensure();
          if (!ac) return;
          const loads = [];
          if (pew.enabled) loads.push(pew.loadSample(ac));
          if (beep.enabled) loads.push(beep.loadSample(ac));
          if (carCrash.enabled) loads.push(carCrash.loadSample(ac));
          await Promise.all(loads);
        }

        function preloadTitleMusic() {
          const audio = ensureTitleAudio();
          if (!audio) return Promise.resolve();
          audio.load();
          return Promise.resolve();
        }

        function preloadVegasMusic() {
          const ac = ensure();
          if (!ac || !vegasMusic.enabled) return Promise.resolve();
          return vegasMusic.loadSample(ac);
        }

        function preloadLevelTwoMusic() {
          const ac = ensure();
          if (!ac || !levelTwoMusic.enabled) return Promise.resolve();
          return levelTwoMusic.loadSample(ac);
        }

        function preloadMusic() {
          return Promise.all([preloadTitleMusic(), preloadVegasMusic(), preloadLevelTwoMusic()]);
        }

        function resume() {
          const ac = ensure();
          if (allowTitleMusic && titleMusicPending) void unlockTitleMusic();
          if (ac && vegasMusicPending) void startVegasMusic(ac);
          if (ac && levelTwoMusicPending) void startLevelTwoMusic();
          return ac;
        }

        function playBusBell() {
          const ac = resume();
          if (!ac) return;
          const now = ac.currentTime;
          if (routemasterBell.enabled) {
            routemasterBell.play(ac, now, 0.95, false);
            return;
          }
          playKerchingSynth(ac, now);
        }

        return {
          resume,
          preloadSfx,
          preloadMusic,
          preloadTitleMusic,
          preloadVegasMusic,
          preloadLevelTwoMusic,
          beginTitleScreens,
          unlockTitleMusic,
          unlockTitleMusicFromGesture,
          hasTitleMusic: () => titleMusic.enabled,
          isTitleMusicPlaying,
          isTitleMusicPending: () => titleMusicPending,
          startGameMusic,
          startLevelTwoMusic,
          stopGameMusic,
          playZap,
          playKerching,
          playCrash,
          playBusBell,
        };
      }

      const sfx = createArenaAudio();

      function isLandscapePhone() {
        return window.matchMedia("(orientation: landscape) and (max-height: 520px)").matches;
      }

      function layoutControls() {
        const land = isLandscapePhone();
        leftLiftBtn.hidden = !land;
        liftBtn.hidden = land;
      }

      const STICK_DRIFT_GAIN = 1.9;
      const STICK_TAP_MULT = 2;
      let stickDir = 0;
      let stickDirY = 0;
      let stickNormX = 0;
      let stickNormY = 0;
      let stickPointerId = null;
      const STICK_DEAD = 0.22;
      const LEVEL2_STICK_DEAD = 0.12;
      const thumbstickKnobEl = thumbstickEl.querySelector(".thumbstick-knob");

      function usingLevel2Stick() {
        return currentLevel === 2 && gamePhase === "playing";
      }

      function paintThumbstick() {
        if (usingLevel2Stick()) {
          thumbstickEl.classList.remove("left", "right", "up", "down");
          if (thumbstickKnobEl) {
            thumbstickKnobEl.style.transform = `translate(${stickNormX * 38}%, ${stickNormY * 38}%)`;
          }
          thumbstickEl.setAttribute("aria-label", "Hold any direction to drive");
          thumbstickEl.setAttribute(
            "aria-valuenow",
            String(Math.round(Math.hypot(stickNormX, stickNormY) * 100)),
          );
          return;
        }

        if (thumbstickKnobEl) thumbstickKnobEl.style.transform = "";
        thumbstickEl.classList.toggle("left", stickDir < 0);
        thumbstickEl.classList.toggle("right", stickDir > 0);
        thumbstickEl.classList.toggle("up", false);
        thumbstickEl.classList.toggle("down", false);
        thumbstickEl.setAttribute("aria-label", "Hold left or right");
        thumbstickEl.setAttribute("aria-valuenow", String(stickDir));
      }

      function stickFromClientX(clientX) {
        const rect = thumbstickEl.getBoundingClientRect();
        const x = (clientX - rect.left) / rect.width;
        if (x < 0.5 - STICK_DEAD) return -1;
        if (x > 0.5 + STICK_DEAD) return 1;
        return 0;
      }

      function stickFromPointerOmni(clientX, clientY) {
        const rect = thumbstickEl.getBoundingClientRect();
        const nx = ((clientX - rect.left) / rect.width - 0.5) * 2;
        const ny = ((clientY - rect.top) / rect.height - 0.5) * 2;
        const mag = Math.hypot(nx, ny);
        if (mag < LEVEL2_STICK_DEAD) return { x: 0, y: 0 };
        const scale = Math.min(mag, 1) / mag;
        return { x: nx * scale, y: ny * scale };
      }

      function updateStickFromPointer(clientX, clientY) {
        if (usingLevel2Stick()) {
          const next = stickFromPointerOmni(clientX, clientY);
          if (stickNormX === next.x && stickNormY === next.y) return;
          stickNormX = next.x;
          stickNormY = next.y;
          stickDir = Math.abs(next.x) >= Math.abs(next.y) ? Math.sign(next.x) || 0 : 0;
          stickDirY = Math.abs(next.y) > Math.abs(next.x) ? Math.sign(next.y) || 0 : 0;
        } else {
          const next = stickFromClientX(clientX);
          if (stickDir === next) return;
          stickDir = next;
          stickDirY = 0;
          stickNormX = next;
          stickNormY = 0;
        }
        paintThumbstick();
      }

      function resetStick() {
        stickDir = 0;
        stickDirY = 0;
        stickNormX = 0;
        stickNormY = 0;
        paintThumbstick();
      }

      function bindThumbstick() {
        function endStick(pointerId) {
          if (stickPointerId !== pointerId) return;
          stickPointerId = null;
          resetStick();
          window.removeEventListener("pointermove", onStickMove);
          window.removeEventListener("pointerup", onStickEnd);
          window.removeEventListener("pointercancel", onStickEnd);
        }

        function onStickMove(e) {
          if (e.pointerId !== stickPointerId) return;
          updateStickFromPointer(e.clientX, e.clientY);
        }

        function onStickEnd(e) {
          endStick(e.pointerId);
        }

        thumbstickEl.addEventListener("pointerdown", (e) => {
          if (thumbstickEl.classList.contains("is-disabled")) return;
          if (stickPointerId !== null) return;
          stickPointerId = e.pointerId;
          updateStickFromPointer(e.clientX, e.clientY);
          window.addEventListener("pointermove", onStickMove);
          window.addEventListener("pointerup", onStickEnd);
          window.addEventListener("pointercancel", onStickEnd);
        });
      }

      function bindLiftButton(btn) {
        btn.addEventListener("pointerdown", (e) => {
          if (btn.disabled) return;
          e.preventDefault();
          if (gamePhase === "attract") {
            startGameFromAttract(btn);
            return;
          }
          if (gamePhase === "gameover") {
            returnToAttractFromGameOver(btn);
            return;
          }
          if (gamePhase === "level1beat") {
            flashButton(btn);
            beginLevelTwo();
            return;
          }
          if (gamePhase !== "playing") return;
          tapLift(btn);
        });
      }

      function isStandaloneDisplay() {
        return (
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.navigator.standalone === true
        );
      }

      function isFullscreenActive() {
        return Boolean(
          document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.webkitCurrentFullScreenElement,
        );
      }

      function updateChromeHint() {
        if (!chromeHintEl) return;
        const hide = !isLandscapePhone() || isStandaloneDisplay() || isFullscreenActive();
        chromeHintEl.classList.toggle("is-hidden", hide);
      }

      function tryImmersiveMode() {
        sfx.resume();
        const el = document.documentElement;
        const req =
          el.requestFullscreen?.bind(el) ||
          el.webkitRequestFullscreen?.bind(el) ||
          el.webkitEnterFullscreen?.bind(el);
        if (req && !isFullscreenActive()) req().catch(() => {});
        hideMobileBrowserChrome();
        updateChromeHint();
      }

      function hideMobileBrowserChrome() {
        window.scrollTo(0, 1);
        requestAnimationFrame(() => window.scrollTo(0, 0));
      }

      function syncViewportHeight() {
        if (!isLandscapePhone()) {
          document.documentElement.style.height = "";
          document.body.style.height = "";
          return;
        }
        const h = window.visualViewport?.height ?? window.innerHeight;
        document.documentElement.style.height = `${h}px`;
        document.body.style.height = `${h}px`;
      }

      window.addEventListener("orientationchange", () => {
        setTimeout(() => {
          layoutControls();
          syncViewportHeight();
          hideMobileBrowserChrome();
          if (isLandscapePhone()) tryImmersiveMode();
          updateChromeHint();
        }, 250);
      });

      window.addEventListener("resize", layoutControls);

      window.visualViewport?.addEventListener("resize", () => {
        syncViewportHeight();
        layoutControls();
        updateChromeHint();
      });

      document.addEventListener("fullscreenchange", updateChromeHint);
      document.addEventListener("webkitfullscreenchange", updateChromeHint);

      function needsAudioStartGate() {
        return sfx.hasTitleMusic();
      }

      function showAudioStartOverlay() {
        if (!audioStartOverlay || !needsAudioStartGate()) return;
        audioStartOverlay.classList.remove("is-hidden");
      }

      function hideAudioStartOverlay() {
        audioStartOverlay?.classList.add("is-hidden");
      }

      function wantsLevelTwoTest() {
        const q = new URLSearchParams(location.search);
        if (q.get("level") === "2" || q.get("test") === "level2") return true;
        const hash = location.hash.replace(/^#/, "");
        if (!hash) return false;
        if (hash === "level2" || hash === "level=2") return true;
        const hq = new URLSearchParams(hash);
        return hq.get("level") === "2" || hq.get("test") === "level2";
      }

      function tryStartAfterAudioGate() {
        if (!assetsReady || !audioGatePassed || gamePhase !== "loading") return;
        if (startMode === "level2") {
          beginLevelTwoTest();
          return;
        }
        if (startMode === "intro") beginIntroSequence();
        else if (startMode === "playing") {
          void sfx.startGameMusic();
          beginPlayingDirectly();
        }
      }

      function passAudioGateFromGesture() {
        if (audioGatePassed) return;
        audioGatePassed = true;
        hideAudioStartOverlay();
        sfx.unlockTitleMusicFromGesture();
        sfx.resume();

      function buildSolidMap(segments, width, height) {
        const map = new Uint8Array(width * height);
        for (const [y, x0, x1] of segments) {
          const row = y * width;
          for (let x = x0; x <= x1; x++) map[row + x] = 1;
        }
        return map;
      }

      function buildZooxSolidMap(source, margin) {
        const out = new Uint8Array(W * H);
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (!source[y * W + x]) continue;
            for (let dy = -margin; dy <= margin; dy++) {
              for (let dx = -margin; dx <= margin; dx++) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < W && ny >= 0 && ny < H) out[ny * W + nx] = 1;
              }
            }
          }
        }
        return out;
      }

      function findSurfaceAt(map, x, minY = 0) {
        for (let y = minY; y < H - 1; y++) {
          if (map[y * W + x] && !map[(y - 1) * W + x] && map[(y + 1) * W + x]) return y;
        }
        return null;
      }

      function spriteMaxDy(pixels) {
        let maxDy = 0;
        for (const [, dy] of pixels) if (dy > maxDy) maxDy = dy;
        return maxDy;
      }

      function vehicleYOnSurface(surfaceY, pixels) {
        return surfaceY - spriteMaxDy(pixels) - 1;
      }

      function findDropColumn(map, width, height) {
        const mid = Math.floor(width / 2);
        let centerGap = height;
        for (let y = 0; y < height; y++) {
          if (map[y * width + mid]) {
            centerGap = y;
            break;
          }
        }
        if (centerGap >= 100) return mid;

        let bestX = mid;
        let bestGap = 0;
        for (let x = 80; x < width - 80; x += 8) {
          let first = height;
          for (let y = 0; y < height; y++) {
            if (map[y * width + x]) {
              first = y;
              break;
            }
          }
          if (first > bestGap) {
            bestGap = first;
            bestX = x;
          }
        }
        return bestX;
      }

      function findPlatformCenterX(surfaceY) {
        let x0 = W;

        for (let x = 0; x < W; x++) {

            x1 = Math.max(x1, x);
          }
        }
        if (x1 < x0) return Math.floor(W / 2);
        return Math.floor((x0 + x1) / 2);
      }

      function resolveCapriSpawn() {

        const minY = Math.floor(H * 0.38);
        const surfaceY = findSurfaceAt(solid, probeX, minY);
        dropX = surfaceY ? findPlatformCenterX(surfaceY) : probeX;
        const seatY = findSurfaceAt(solid, dropX, minY) || surfaceY;
        let y = seatY ? vehicleYOnSurface(seatY, carPixelsLeft) : CAR_HH;
        for (let i = 0; i < CAR_H; i++) {
          if (vehicleFits(dropX, y, carPixelsLeft)) break;
          y -= 1;

        dropY = y;

      function decodeSolidRle(b64, length) {
        const bin = atob(b64);
        const solid = new Uint8Array(length);
        let pos = 0;
        for (let i = 0; i < bin.length; ) {
          const v = bin.charCodeAt(i++);
          const n = bin.charCodeAt(i++) | (bin.charCodeAt(i++) << 8);
          solid.fill(v, pos, pos + n);
          pos += n;
        }
        return solid;
      }

      async function loadLevel2SolidMask() {
        if (LEVEL2_ARENA?.solidRle && LEVEL2_ARENA?.solidLen) {
          return decodeSolidRle(LEVEL2_ARENA.solidRle, LEVEL2_ARENA.solidLen);

        if (LEVEL2_ARENA?.width) {
          try {
            const solidBuf = await fetch(resolveAssetUrl("assets/level2-solid.bin")).then((res) =>
              res.ok ? res.arrayBuffer() : null,
            );
            if (solidBuf) return new Uint8Array(solidBuf);

        return null;

      function drawCapriLeft(ctx, w, h) {

        function drawWheelArch(cx) {
          ctx.fillStyle = blueSh;

          ctx.quadraticCurveTo(cx - 10, bottom - 15, cx, bottom - 15);
          ctx.quadraticCurveTo(cx + 10, bottom - 15, cx + 12, bottom - 4);

        function drawWheel(cx) {
          ctx.fillStyle = tire;
          ctx.beginPath();
          ctx.ellipse(cx, bottom - 1, wheelR, wheelR - 1, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = tireHi;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(cx, bottom - 1, wheelR - 1, wheelR - 2, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = chrome;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(cx, bottom - 1, wheelR - 3, wheelR - 4, 0, 0, Math.PI * 2);

      function drawZooxLeft(ctx, w, h) {

      function extractCarPixels(surface) {
        if (surface instanceof HTMLImageElement) {
          const src = surface.currentSrc || surface.src || "";
          if (!src.startsWith("data:")) {
            return [];
          }
        }
        let canvas = surface;
        if (surface instanceof HTMLImageElement || surface instanceof ImageBitmap) {
          const tmp = document.createElement("canvas");
          tmp.width = surface.naturalWidth || surface.width;
          tmp.height = surface.naturalHeight || surface.height;
          tmp.getContext("2d").drawImage(surface, 0, 0);
          canvas = tmp;
        }
        const w = canvas.width;
        const h = canvas.height;
        const data = canvas.getContext("2d").getImageData(0, 0, w, h).data;
        const pixels = [];
        const cx = w / 2;
        const cy = h / 2;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (data[(y * w + x) * 4 + 3] > 32) {
              pixels.push([Math.round(x - cx), Math.round(y - cy)]);
            }
          }
        }
        return pixels;
      }

      function shrinkCarPixels(pixels, insetX, insetY) {
        if (!pixels.length || (insetX <= 0 && insetY <= 0)) return pixels;
        let minX = Infinity;
        let maxX = -Infinity;
        let minY = Infinity;
        let maxY = -Infinity;
        for (const [dx, dy] of pixels) {
          minX = Math.min(minX, dx);
          maxX = Math.max(maxX, dx);
          minY = Math.min(minY, dy);
          maxY = Math.max(maxY, dy);
        }
        return pixels.filter(
          ([dx, dy]) =>
            dx > minX + insetX &&
            dx < maxX - insetX &&
            dy > minY + insetY &&
            dy < maxY - insetY,
        );
      }

      function buildCapri() {

        const right = document.createElement("canvas");
        right.width = CAR_W;
        right.height = CAR_H;
        const rctx = right.getContext("2d");
        rctx.translate(CAR_W, 0);
        rctx.scale(-1, 1);
        rctx.drawImage(left, 0, 0);
        carSpriteRight = right;
        carPixelsRight = carPixelsLeft.map(([dx, dy]) => [-dx, dy]);
      }

      function buildLevel2Capri() {
        const baseW = 30;
        const baseH = 48;

        function makeSprite(drawFn) {
          const canvas = document.createElement("canvas");
          canvas.width = LEVEL2_CAR_W;
          canvas.height = LEVEL2_CAR_H;
          const cctx = canvas.getContext("2d");
          cctx.scale(LEVEL2_CAR_W / baseW, LEVEL2_CAR_H / baseH);
          drawFn(cctx, baseW, baseH);
          return canvas;
        }

        level2CarFront = makeSprite(drawCapriFront);
        level2PixelsFront = extractCarPixels(level2CarFront);
        level2WallPixelsFront = shrinkCarPixels(level2PixelsFront, 1, 3);
        level2CarRear = makeSprite(drawCapriRear);
        level2PixelsRear = extractCarPixels(level2CarRear);
        level2WallPixelsRear = shrinkCarPixels(level2PixelsRear, 1, 3);
        level2CarSide = makeSprite(drawCapriSideTop);
        level2PixelsSide = extractCarPixels(level2CarSide);
        level2WallPixelsSide = shrinkCarPixels(level2PixelsSide, 5, 2);
        level2MovePixels = level2PixelsFront.slice();
        if (!level2MovePixels.length) level2MovePixels = level2PixelsFront;
      }

      function level2CarBundle() {
        const facing = ball?.level2Facing || "front";
        if (facing === "rear") {
          return {
            sprite: level2CarRear,
            pixels: level2PixelsRear,
            wallPixels: level2WallPixelsRear,
            w: LEVEL2_CAR_W,
            h: LEVEL2_CAR_H,
          };
        }
        if (facing === "side") {
          return {
            sprite: level2CarSide,
            pixels: level2PixelsSide,
            wallPixels: level2WallPixelsSide,
            w: LEVEL2_CAR_W,
            h: LEVEL2_CAR_H,
          };
        }
        return {
          sprite: level2CarFront,
          pixels: level2PixelsFront,
          wallPixels: level2WallPixelsFront,
          w: LEVEL2_CAR_W,
          h: LEVEL2_CAR_H,

      function saveLevelOneArena() {
        level1Arena = {
          W,
          H,
          solid,
          zooxSolid,
          dropX,

      }

      function level2CollisionPixels() {
        return level2MovePixels.length ? level2MovePixels : level2PixelsFront;
      }

      function enterLevelTwoArena() {
        if (!level2Solid) return;
        const arenaW = level2Background?.naturalWidth || LEVEL2_ARENA?.width;
        const arenaH = level2Background?.naturalHeight || LEVEL2_ARENA?.height;
        if (!arenaW || !arenaH) return;
        W = arenaW;
        H = arenaH;
        solid = level2Solid;
        canvas.width = W;
        canvas.height = H;
        level2Cones = (LEVEL2_ARENA?.cones ?? []).map((cone, id) => ({
          x: cone.x,
          y: cone.y,
          id,
          collected: false,
        }));
        dropX = LEVEL2_ARENA?.spawn?.x ?? W / 2;
        dropY = LEVEL2_ARENA?.spawn?.y ?? H / 2;
      }

      function restoreLevelOneArena() {
        if (!level1Arena) return;
        W = level1Arena.W;
        H = level1Arena.H;
        solid = level1Arena.solid;
        zooxSolid = level1Arena.zooxSolid;
        dropX = level1Arena.dropX;
        dropY = level1Arena.dropY;

        canvas.height = H;

        level2Buses = [];
        level2Fireballs = [];
